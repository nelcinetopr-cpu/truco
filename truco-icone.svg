<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="felt" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1f6a4d"/>
      <stop offset="0.55" stop-color="#12402f"/>
      <stop offset="1" stop-color="#0a281d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d2"/>
      <stop offset="0.38" stop-color="#f6dc8a"/>
      <stop offset="0.72" stop-color="#e3b54f"/>
      <stop offset="1" stop-color="#c99632"/>
    </linearGradient>
    <pattern id="back" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="#8d2a22"/>
      <rect width="11" height="22" fill="#a9382d"/>
    </pattern>
    <g id="club">
      <circle cx="0" cy="-10" r="10.5"/>
      <circle cx="-10.5" cy="5" r="10.5"/>
      <circle cx="10.5" cy="5" r="10.5"/>
      <circle cx="0" cy="2" r="6"/>
      <path d="M-1.5 2 Q-2 16 -8 24 L8 24 Q2 16 1.5 2 Z"/>
    </g>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- fundo: feltro com aro de madeira -->
  <rect width="512" height="512" rx="112" fill="#4a2c18"/>
  <rect x="18" y="18" width="476" height="476" rx="96" fill="url(#felt)"/>
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#6b4226" stroke-width="4"/>

  <!-- carta de trás (verso) -->
  <g transform="rotate(-14 256 270)" filter="url(#shadow)">
    <rect x="128" y="104" width="196" height="276" rx="22" fill="#f7f1e3"/>
    <rect x="140" y="116" width="172" height="252" rx="14" fill="url(#back)"/>
  </g>

  <!-- carta da frente: o zap (4 de paus), dourada como manilha -->
  <g transform="rotate(9 256 270)" filter="url(#shadow)">
    <rect x="190" y="118" width="196" height="276" rx="22" fill="url(#gold)" stroke="#a9781f" stroke-width="5"/>
    <text x="214" y="178" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="58" fill="#1d1a14">4</text>
    <use href="#club" transform="translate(233 214) scale(1.05)" fill="#1d1a14"/>
    <use href="#club" transform="translate(288 262) scale(3.4)" fill="#1d1a14"/>
    <path transform="translate(346 350)" fill="#7a4f05" d="M14 0l4.1 9.3 10 .9-7.6 6.6 2.3 9.8L14 21.4 5.2 26.6l2.3-9.8L-.1 10.2l10-.9z"/>
  </g>
</svg>
