<style>
/* Layout: mesa de feltro oval no centro, mão do jogador embaixo, placar/fichas ao lado (empilha no celular). Tema único, escuro, de propósito. */
:root {
  --felt: #12402f;
  --felt-deep: #0a281d;
  --wood: #4a2c18;
  --wood-light: #6b4226;
  --brass: #e0ad4a;
  --card: #f7f1e3;
  --ink: #1d1a14;
  --red: #b8322a;
  --text: #edf3ea;
  --muted: #9fbcab;
  --panel: #0d2f23;
  --line: #2a5a46;
  --them: #e2735f;
  --display: "Alfa Slab One", "Rockwell", "Georgia", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* o site fora do claude.ai não tem esse reset */
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 50% 0%, #163c2f 0%, #08201a 70%) fixed, #08201a;
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
}
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 18px;
}
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 40px); margin: 0; letter-spacing: .5px; color: var(--brass); text-wrap: balance; }
h1.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; letter-spacing: 2px; }
h1 .logo { width: clamp(40px, 8vw, 56px); height: auto; flex: none; }
h1 small { font-family: var(--body); font-size: 13px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-left: 10px; font-weight: 600; }
h2 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 0; color: var(--text); }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--muted); margin: 0; font-weight: 800; }
p { margin: 0; }
.muted { color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
input, select {
  font: inherit; color: var(--text); background: var(--felt-deep); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 11px; min-width: 0;
}
select { max-width: 100%; }
#soloN { flex: 1 1 200px; min-width: 0; width: 100%; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
/* no celular o "hover" fica preso depois do toque: só usa hover onde tem mouse, e nunca nas cartas */
@media (hover: hover) {
  button:not(.card):hover:not(:disabled) { background: #1d5a43; }
  button.primary:hover:not(:disabled) { background: #f0bf5c; }
  button.danger:hover:not(:disabled) { background: #6e2820; }
  button.shout:hover:not(:disabled) { background: #cc3b31; }
  .hand button.card:not(:disabled):hover { transform: translateY(-8px); }
  }
button.card { -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent; font: inherit; color: var(--ink); }
button.card.red { color: var(--red); }
button {
  font: inherit; font-weight: 800; cursor: pointer; border-radius: 10px; padding: 10px 16px;
  border: 1px solid var(--line); background: #164a37; color: var(--text);
}

button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--brass); color: #2a1a05; border-color: #b8862c; }

button.danger { background: #5a1f19; border-color: #7a2c24; }

button.shout { font-family: var(--display); font-weight: 400; font-size: 18px; letter-spacing: 1px; background: var(--red); border-color: #8f241d; color: #fff3e6; }

button.small { padding: 6px 10px; font-size: 13px; }
.notice { background: #3a2a10; border: 1px solid #6b4d1b; color: #f3dcae; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
main#app { display: grid; gap: 18px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 18px; }
.mesas-list { display: grid; gap: 8px; }
.mesa-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--felt-deep); }
.code { font-family: var(--display); letter-spacing: 2px; color: var(--brass); }
.tag { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: #1b4c3a; color: var(--muted); white-space: nowrap; }

/* ---- mesa ---- */
.game { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
@media (max-width: 860px) { .game { grid-template-columns: minmax(0, 1fr); } }
.board { display: grid; gap: 14px; min-width: 0; }
.scorebar { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.score { display: grid; align-content: start; gap: 2px; padding: 10px 12px; min-width: 0; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.score b { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.score.us b { color: var(--brass); }
.score.them b { color: var(--them); }
.pips { display: flex; gap: 6px; align-items: center; }
.pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.pip.us { background: var(--brass); border-color: var(--brass); }
.pip.them { background: var(--them); border-color: var(--them); }
.pip.tie { background: #6f8b7d; border-color: #6f8b7d; }

.mesa {
  position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 48% / 46%;
  background: radial-gradient(ellipse at 50% 40%, #1b5a42 0%, var(--felt) 45%, var(--felt-deep) 100%);
  border: 14px solid var(--wood);
  box-shadow: inset 0 0 0 3px var(--wood-light), inset 0 0 60px rgba(0,0,0,.55), 0 14px 40px rgba(0,0,0,.5);
  overflow: hidden;
}
@media (max-width: 560px) { .mesa { aspect-ratio: 1 / 1.05; border-width: 10px; } }
.seat { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 4px; text-align: center; max-width: 30%; }
.seat .name { font-weight: 800; font-size: 13px; padding: 3px 10px; border-radius: 99px; background: rgba(0,0,0,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; border: 2px solid transparent; }
.seat.us .name { color: var(--brass); }
.seat.them .name { color: var(--them); }
.seat.turn .name { border-color: var(--brass); box-shadow: 0 0 14px rgba(224,173,74,.6); }
.seat .mini { display: flex; }
.seat .mini .card { width: 22px; margin-left: -8px; border-radius: 4px; }
.seat .mini .card:first-child { margin-left: 0; }
.seat .role { font-size: 11px; color: var(--muted); font-weight: 600; }
@media (max-width: 560px) {
  .seat { max-width: 34%; }
  .seat .name { font-size: 11px; padding: 2px 7px; }
  .seat .mini .card { width: 14px; margin-left: -6px; border-width: 2px; }
  .seat .role { display: none; }
}
.played { position: absolute; transform: translate(-50%, -50%); }
.played .card { width: clamp(40px, 8.5vw, 64px); }
.played.win .card { box-shadow: 0 0 0 3px var(--brass), 0 6px 14px rgba(0,0,0,.5); }
.played.old { opacity: 1; }
.played.old .card { transform: scale(.88); }
.last-trick { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); background: rgba(0,0,0,.35); padding: 3px 10px; border-radius: 99px; white-space: nowrap; pointer-events: none; }
.vira-tile .card { width: 30px; font-size: 10px; transform: rotate(-6deg); }
.vira-tile .vlbl { font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.2; }
.vira-tile .mrk { font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--text); }
.mesa.six .played .card { width: clamp(34px, 6.5vw, 52px); }
.banner {
  position: absolute; left: 50%; top: 50%; z-index: 3; transform: translate(-50%, -50%) rotate(-4deg);
  font-family: var(--display); font-size: clamp(24px, 6vw, 46px); color: #fff3e6; background: var(--red);
  padding: 4px 18px; border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.5); white-space: nowrap; pointer-events: none;
}
@media (prefers-reduced-motion: no-preference) { .banner { animation: pop .35s ease-out; } }
@keyframes pop { from { transform: translate(-50%, -50%) rotate(-4deg) scale(.6); opacity: 0; } }

/* ---- tela de jogo: tudo cabe numa tela ---- */
.tablebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tablebar .small { margin-left: auto; }
.tablebar .stake { color: var(--brass); background: var(--felt-deep); border: 1px solid var(--line); }
.board > .tablebar { display: none; }
body.in-game header.top, body.in-game #notice { display: none; }
body.in-game .wrap { max-width: 1280px; padding-block: 10px; }
body.in-game .game {
  height: calc(100dvh - 20px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  align-items: stretch;
}
body.in-game .board { display: flex; flex-direction: column; gap: 10px; min-height: 0; height: 100%; }
body.in-game .side { overflow: auto; min-height: 0; align-content: start; }
body.in-game .side > .tablebar { padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
body.in-game .scorebar { grid-template-columns: repeat(5, minmax(0, 1fr)); flex: none; }
body.in-game .score { padding: 6px 10px; }
body.in-game .score b { font-size: 24px; }
body.in-game .mesa { flex: 1 1 0; min-height: 140px; aspect-ratio: auto; }
body.in-game .actions { flex: none; gap: 6px; }
body.in-game .hand { flex: none; min-height: 0; flex-wrap: nowrap; gap: 10px; }
body.in-game .hand .card { width: min(92px, 20vw, 12dvh); font-size: clamp(12px, 2.4dvh, 19px); }
body.in-game .played .card { width: min(64px, 8.5vw, 8dvh); }
body.in-game .partner { flex: none; }
@media (max-width: 860px) {
  body.in-game .game { height: auto; }
  body.in-game .board { height: calc(100dvh - 20px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
  body.in-game .board > .tablebar { display: flex; }
  body.in-game .side { display: none; } /* no celular fica só a mesa; saldo e pagamentos estão no saguão */
}
@media (max-width: 560px) {
  body.in-game .tablebar { flex-wrap: nowrap; gap: 6px; }
  body.in-game .tablebar > .muted { display: none; }
  body.in-game .tablebar .code { font-size: 14px; letter-spacing: 1px; }
  body.in-game .tablebar .tag { padding: 2px 6px; font-size: 11px; }
  body.in-game .tablebar .small { padding: 6px 9px; font-size: 13px; }
  body.in-game .tablebar .ptt { margin-left: auto; }
  body.in-game .tablebar .ptt ~ .small { margin-left: 0; }
  body.in-game .score { padding: 5px 6px; border-radius: 10px; }
  body.in-game .score h3 { font-size: 9px; letter-spacing: .5px; }
  body.in-game .score b { font-size: 20px; }
  body.in-game .pips { gap: 3px; margin-top: 4px !important; }
  body.in-game .pip { width: 10px; height: 10px; }
  body.in-game .vira-tile .card { width: 20px; font-size: 7px; }
  body.in-game .vira-tile .vlbl { font-size: 0; }
  body.in-game .vira-tile .mrk { font-size: 18px; }
  body.in-game .vira-tile .row { gap: 4px !important; }
  body.in-game .actions .msg { font-size: 14px; }
  body.in-game .actions button { padding: 8px 12px; }
}

.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line); background: var(--felt-deep); display: grid; place-items: center; flex: none; box-shadow: 0 3px 8px rgba(0,0,0,.45); }
.avatar.ph { font-weight: 800; font-size: 14px; color: var(--muted); }
.seat.us .avatar { border-color: var(--brass); }
.seat.them .avatar { border-color: var(--them); }
.seat.turn .avatar { box-shadow: 0 0 0 3px var(--brass), 0 0 14px rgba(224,173,74,.6); }
.seat.me { grid-auto-flow: column; align-items: center; gap: 6px; max-width: 60%; }
.seat.me .avatar { width: 34px; height: 34px; }
@media (max-width: 560px) { .avatar { width: 30px; height: 30px; } .avatar.ph { font-size: 11px; } .seat.me .avatar { width: 28px; height: 28px; } }
.photo-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.photo-actions { display: grid; gap: 10px; flex: 1 1 180px; min-width: 0; }
.avatar-big .avatar { width: 84px; height: 84px; font-size: 26px; border-color: var(--brass); }
.file-btn { position: relative; display: inline-block; font-weight: 800; cursor: pointer; border-radius: 10px; padding: 10px 16px; border: 1px solid #b8862c; background: var(--brass); color: #2a1a05; font-size: 15px; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.file-btn:focus-within { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ---- conversa da mesa ---- */
.chat-panel { gap: 8px; }
.chat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chat-close { display: none; }
.chat-list { display: grid; gap: 6px; align-content: start; max-height: 240px; min-height: 80px; overflow-y: auto; padding-right: 4px; overscroll-behavior: contain; }
.chat-msg { display: grid; gap: 2px; justify-items: start; max-width: 92%; padding: 6px 10px; border-radius: 12px 12px 12px 4px; background: var(--felt-deep); border: 1px solid var(--line); overflow-wrap: anywhere; }
.chat-msg.mine { justify-self: end; justify-items: end; border-radius: 12px 12px 4px 12px; background: #1b4c3a; }
.chat-msg .who { font-size: 11px; font-weight: 800; color: var(--muted); }
.chat-msg.mine .who { color: var(--brass); }
.chat-msg .txt { font-size: 14px; }
.chat-empty, .chat-note { font-size: 12px; margin: 0; }
.chat-form { display: flex; gap: 6px; align-items: center; }
.chat-form input { flex: 1 1 auto; min-width: 0; }
.ptt { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; background: #1b4c3a; border-color: var(--brass); color: var(--brass); }
.ptt.on { background: var(--red); border-color: var(--red); color: #fff3e6; box-shadow: 0 0 0 4px rgba(184,50,42,.35); }
.seat.talking .avatar { box-shadow: 0 0 0 3px #5fd38a, 0 0 16px rgba(95,211,138,.8); }

<script>
/* =========================================================
   REGRAS — Truco Paulista (baralho de 40 cartas, com vira)
   ========================================================= */
const RANKS = ['4','5','6','7','Q','J','K','A','2','3'];
const SUITS = ['o','e','c','p']; // ouros < espadas < copas < paus (zap), ordem das manilhas
const SUIT_SYM = { o:'♦', e:'♠', c:'♥', p:'♣' };
const RAISE_NAME = { 3:'Truco', 6:'Seis', 9:'Nove', 12:'Doze' };
const NEXT_VALUE = { 1:3, 3:6, 6:9, 9:12 };
const team = s => s % 2;

function manilhaRank(vira) { return RANKS[(RANKS.indexOf(vira[0]) + 1) % RANKS.length]; }
function isManilha(c, vira) { return c[0] === manilhaRank(vira); }
function strength(c, vira) { return isManilha(c, vira) ? 100 + SUITS.indexOf(c[1]) : RANKS.indexOf(c[0]); }
function cardLabel(c) { return c[0] + SUIT_SYM[c[1]]; }

function randInt(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function newDeck() {
  const d = [];
  for (const r of RANKS) for (const s of SUITS) d.push(r + s);
  for (let i = d.length - 1; i > 0; i--) { const j = randInt(i + 1); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
function nextOfTeam(from, t, n) { for (let i = 1; i <= n; i++) { const s = (from + i) % n; if (team(s) === t) return s; } return from; }
function firstOfTeamFrom(start, t, n) { for (let i = 0; i < n; i++) { const s = (start + i) % n; if (team(s) === t) return s; } return start; }
function nick(st, seat) { const id = st.seats[seat]; return (id && st.names[id]) || 'Jogador ' + (seat + 1); }
function teamLabel(t) { return t === 0 ? 'Time 1' : 'Time 2'; }
function addLog(st, text) { st.log = [text, ...(st.log || [])].slice(0, 40); }

function deal(st) {
  const n = st.n, deck = newDeck();
  const hands = [];
  for (let s = 0; s < n; s++) hands.push(deck.splice(0, 3));
  const vira = deck.pop();
  const mao = (st.dealer + 1) % n;
  const [a, b] = st.score;
  const ferro = a === 11 && b === 11;
  const onzeTeam = !ferro && (a === 11 || b === 11) ? (a === 11 ? 0 : 1) : -1;
  st.hand = {
    vira, hands, played: [[]], rw: [], turn: mao, mao, value: 1, lastRaise: -1, pending: null,
    ferro, onzeTeam, onzeDecider: onzeTeam >= 0 ? firstOfTeamFrom(mao, onzeTeam, n) : -1,
  };
  st.result = null;
  st.phase = onzeTeam >= 0 ? 'onze' : 'play';
  addLog(st, `${nick(st, st.dealer)} deu as cartas. Vira ${cardLabel(vira)}, manilha é ${manilhaRank(vira)}.`);
  if (ferro) addLog(st, 'Mão de ferro: ninguém vê as cartas do parceiro, vale 1 e sem truco.');
  if (onzeTeam >= 0) addLog(st, `Mão de onze para o ${teamLabel(onzeTeam)}.`);
}

// Quem leva a mão a partir dos resultados das vazas (-1 = empate/cangou).
// Retorna o time vencedor, -1 se empatou tudo, ou null se a mão continua.
// raiser = time que fez o último pedido aceito (truco, seis...), ou -1 se ninguém pediu.
// Quem pediu precisa ganhar: se as vazas só empatam, quem pediu perde
// (na segunda vaza empatada depois da primeira empatada, ou com as três empatadas).
function decideHand(rw, raiser = -1) {
  const [a, b, c] = rw;
  if (rw.length < 2) return null;
  if (rw.length === 2) {
    if (a === -1 && b !== -1) return b;
    if (a !== -1 && b === -1) return a;
    if (a !== -1 && a === b) return a;
    if (a === -1 && b === -1 && raiser >= 0) return 1 - raiser;
    return null;
  }
  if (c === -1) { if (a !== -1) return a; if (b !== -1) return b; return raiser >= 0 ? 1 - raiser : -1; }
  return c;
}

function endHand(st, winner, points, reason) {
  const h = st.hand;
  h.pending = null;
  if (winner >= 0) st.score[winner] += points;
  st.result = { winner, points, reason };
  addLog(st, winner >= 0 ? `${teamLabel(winner)} fez ${points} ${points === 1 ? 'tento' : 'tentos'} (${reason}).` : 'Empatou tudo, ninguém marca.');
  const champ = st.score[0] >= 12 ? 0 : st.score[1] >= 12 ? 1 : -1;
  if (champ < 0) { st.phase = 'handEnd'; return; }
  st.phase = 'gameEnd';
  const delta = {};
  st.seats.forEach((id, s) => { if (id) delta[id] = (delta[id] || 0) + (team(s) === champ ? st.stake : -st.stake); });
  for (const id in delta) st.balances[id] = (st.balances[id] || 0) + delta[id];
  st.games = [{ n: st.gameNo, winner: champ, score: [...st.score], at: Date.now(), delta }, ...(st.games || [])].slice(0, 50);
  addLog(st, `${teamLabel(champ)} ganhou a partida ${st.gameNo} por ${Math.min(st.score[champ], 12)} a ${st.score[1 - champ]}. Cada um do time leva ${st.stake} ${st.stake === 1 ? 'ficha' : 'fichas'}.`);
}

function playCard(st, seat, idx, covered) {
  const h = st.hand;
  const card = h.hands[seat].splice(idx, 1)[0];
  const r = h.rw.length;
  h.played[r].push({ seat, card, covered: !!covered });
  if (h.played[r].length < st.n) { h.turn = (seat + 1) % st.n; return; }
  const plays = h.played[r];
  const str = p => (p.covered ? -1 : strength(p.card, h.vira));
  const best = Math.max(...plays.map(str));
  const top = plays.filter(p => str(p) === best);
  const teams = new Set(top.map(p => team(p.seat)));
  let w = teams.size === 1 ? team(top[0].seat) : -1;
  let lead = top[0], bySuit = false;
  // Três empates sem truco: na última vaza ganha o naipe mais forte (paus > copas > espadas > ouros).
  if (w === -1 && r === 2 && h.rw[0] === -1 && h.rw[1] === -1 && h.lastRaise < 0) {
    const open = top.filter(p => !p.covered);
    if (open.length) {
      lead = open.reduce((x, y) => (SUITS.indexOf(y.card[1]) > SUITS.indexOf(x.card[1]) ? y : x));
      w = team(lead.seat); bySuit = true;
    }
  }
  h.rw.push(w);
  addLog(st, w >= 0 ? `Vaza ${r + 1}: ${nick(st, lead.seat)} fez com ${cardLabel(lead.card)}${bySuit ? ' pelo naipe' : ''}.` : `Vaza ${r + 1} cangou (empate).`);
  const dec = decideHand(h.rw, h.lastRaise);
  const onlyTies = h.rw.every(w => w === -1);
  if (dec !== null) return endHand(st, dec, h.value, bySuit ? 'empatou as três: ganhou o naipe mais forte' : onlyTies && dec >= 0 ? 'empatou com truco: quem pediu tinha que ganhar' : 'nas vazas');
  h.played.push([]);
  h.turn = lead.seat;
}

function canCallTruco(st, seat) {
  const h = st.hand;
  return st.phase === 'play' && h.turn === seat && !h.ferro && h.onzeTeam < 0 && h.value < 12 && h.lastRaise !== team(seat);
}

/* =========================================================
   BANCO — simulado local, usado quando o Firebase ainda não está configurado
   ========================================================= */
function mockDb() {
  const P = 'trucomock:';
  const listeners = new Set();
  const read = p => { try { const v = localStorage.getItem(P + p); return v ? JSON.parse(v) : undefined; } catch { return undefined; } };
  const snap = p => { const d = read(p); return { id: p.split('/').pop(), exists: !!d, data: () => d, metadata: { fromCache: false, hasPendingWrites: false } }; };
  const notify = () => listeners.forEach(f => f());
  window.addEventListener('storage', e => { if (e.key && e.key.startsWith(P)) notify(); });
  const docRef = p => ({
    path: p, id: p.split('/').pop(),
    get: async () => snap(p),
    set: async d => { localStorage.setItem(P + p, JSON.stringify(d)); notify(); },
    update: async d => { const o = read(p); if (!o) throw { code: 'invalid_argument' }; localStorage.setItem(P + p, JSON.stringify({ ...o, ...d })); notify(); },
    delete: async () => { localStorage.removeItem(P + p); notify(); },
    acquire: async () => ({ acquired: true }),
    onSnapshot(next) { const f = () => next(snap(p)); listeners.add(f); setTimeout(f); return () => listeners.delete(f); },
  });
  const run = (p, q) => {
    const docs = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(P + p + '/') && !k.slice(P.length + p.length + 1).includes('/')) docs.push(snap(k.slice(P.length)));
    }
    for (const [f, v] of q.wh || []) for (let i = docs.length - 1; i >= 0; i--) if (docs[i].data()[f] !== v) docs.splice(i, 1);
    if (q.order) docs.sort((x, y) => (y.data()[q.order] || 0) - (x.data()[q.order] || 0));
    const out = docs.slice(0, q.lim);
    return { docs: out, size: out.length, empty: !out.length, docChanges: () => [], metadata: {} };
  };
  const col = (p, q = { lim: 1000 }) => ({
    path: p,
    orderBy: f => col(p, { ...q, order: f }),
    where: (f, op, v) => col(p, { ...q, wh: [...(q.wh || []), [f, v]] }),
    limit: n => col(p, { ...q, lim: n }),
    get: async () => run(p, q),
    onSnapshot(next) { const f = () => next(run(p, q)); listeners.add(f); setTimeout(f); return () => listeners.delete(f); },
    doc: id => docRef(p + '/' + id),
  });
  return { doc: docRef, collection: col };
}

/* =========================================================
   FIREBASE — Firestore no lugar do banco do claude.ai
   O Firestore não aceita lista dentro de lista (as mãos e as vazas são assim),
   então cada documento vai guardado como texto JSON no campo "j". Os campos usados
   em buscas e nas regras de segurança também ficam soltos no documento.
   ========================================================= */
const TOP_FIELDS = ['updatedAt', 'aliveAt', 'closedAt', 'at', 'to', 'from', 'status', 'confirmedAt', 'uid', 'name', 'table'];
const EMAIL_DOMAIN = 'truco.jogo';   // as contas do Firebase usam usuario@truco.jogo (nenhum e-mail é enviado)
const pinPassword = pin => 'truco#' + pin; // o Firebase exige 6+ caracteres

function fsDb(fs) {
  const enc = d => { const o = { j: JSON.stringify(d) }; for (const k of TOP_FIELDS) if (d[k] !== undefined) o[k] = d[k]; return o; };
  const dec = raw => {
    if (!raw) return undefined;
    const o = raw.j ? JSON.parse(raw.j) : {};
    for (const k of TOP_FIELDS) if (raw[k] !== undefined) o[k] = raw[k];
    return o;
  };
  const wrapDoc = s => ({ id: s.id, exists: s.exists, data: () => dec(s.data()), metadata: s.metadata });
  const wrapQuery = q => ({ docs: q.docs.map(wrapDoc), size: q.size, empty: q.empty, docChanges: () => [], metadata: q.metadata });
  const err = e => { throw { code: e && e.code === 'permission-denied' ? 'invalid_argument' : 'unavailable', message: e && e.message }; };
  const docRef = path => {
    const ref = fs.doc(path);
    return {
      path, id: ref.id,
      get: () => ref.get().then(wrapDoc, err),
      set: d => ref.set(enc(d)).catch(err),
      update: d => {
        if (Object.keys(d).every(k => TOP_FIELDS.includes(k))) return ref.update(d).catch(err);
        return fs.runTransaction(async tx => {
          const s = await tx.get(ref);
          if (!s.exists) throw { code: 'invalid_argument' };
          tx.set(ref, enc({ ...dec(s.data()), ...d }));
        }).catch(err);
      },
      delete: () => ref.delete().catch(err),
      // trava curta: só um jogador por vez mexe (ex.: escolher cadeira)
      acquire: ({ holder, ttlMs = 30000 }) => fs.runTransaction(async tx => {
        const s = await tx.get(ref);
        const now = Date.now(), d = s.exists ? s.data() : null;
        if (d && d.until > now && d.holder !== holder) return { acquired: false };
        tx.set(ref, { holder, until: now + ttlMs });
        return { acquired: true };
      }).catch(() => ({ acquired: false })),
      onSnapshot: (next, onErr) => ref.onSnapshot(s => next(wrapDoc(s)), e => onErr && onErr(e)),
      collection: sub => colRef(path + '/' + sub),
    };
  };
  const colRef = (path, q = fs.collection(path)) => ({
    path,
    where: (f, op, v) => colRef(path, q.where(f, op, v)),
    orderBy: (f, dir) => colRef(path, q.orderBy(f, dir)),
    limit: n => colRef(path, q.limit(n)),
    get: () => q.get().then(wrapQuery, err),
    onSnapshot: (next, onErr) => q.onSnapshot(s => next(wrapQuery(s)), e => onErr && onErr(e)),
    doc: id => docRef(path + '/' + id),
  });
  return { doc: docRef, collection: p => colRef(p) };
}

/* Contas: no Firebase o login é do próprio Firebase Auth (usuário vira usuario@truco.jogo).
   No modo de teste local continua o esquema antigo, com a senha guardada embaralhada no banco simulado. */
let fbAuth = null;
const authApi = {
  async create(key, name, pin) {
    if (!fbAuth) {
      const ref = db.doc('contas/' + key);
      const s = await ref.get();
      if (s.exists && s.data().hash) throw { code: 'exists' };
      const salt = Array.from(crypto.getRandomValues(new Uint8Array(8)), x => x.toString(16).padStart(2, '0')).join('');
      await ref.set({ name, salt, hash: await pinHash(salt, pin), createdAt: Date.now() });
      return name;
    }
    const email = key + '@' + EMAIL_DOMAIN, pw = pinPassword(pin);
    let cred;
    try { cred = await fbAuth.createUserWithEmailAndPassword(email, pw); }
    catch (e) {
      if (e.code !== 'auth/email-already-in-use') throw { code: mapAuthError(e), raw: e.code };
      // O login já existe. Se a senha bate, é uma conta que ficou pela metade (ex.: o cadastro foi apagado ao zerar): recupera.
      try { cred = await fbAuth.signInWithEmailAndPassword(email, pw); }
      catch { throw { code: 'exists' }; }
      const s = await db.doc('contas/' + key).get().catch(() => null);
      if (s && s.exists) return syncProfile(key, s.data(), cred.user);
    }
    await saveProfile(key, name, cred.user);
    return name;
  },
  async signIn(key, pin) {
    if (!fbAuth) {
      const s = await db.doc('contas/' + key).get();
      const d = s.exists ? s.data() : null;
      if (!d || !d.hash) throw { code: 'not_found' };
      if ((await pinHash(d.salt, pin)) !== d.hash) throw { code: 'wrong' };
      return d.name;
    }
    let cred;
    try { cred = await fbAuth.signInWithEmailAndPassword(key + '@' + EMAIL_DOMAIN, pinPassword(pin)); }
    catch (e) { throw { code: mapAuthError(e), raw: e.code }; }
    const s = await db.doc('contas/' + key).get().catch(() => null);
    if (s && s.exists) return syncProfile(key, s.data(), cred.user);
    // login certo, mas sem cadastro (apagado ao zerar): refaz o cadastro com o nome digitado
    const typed = (document.getElementById('lgName') || {}).value || key;
    await saveProfile(key, typed.trim(), cred.user);
    return typed.trim();
  },
  async verifyPin(pin) {
    if (!fbAuth) { await authApi.signIn(myId, pin); return; }
    try {
      const u = fbAuth.currentUser;
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, pinPassword(pin)));
    } catch (e) { throw { code: mapAuthError(e) }; }
  },
  signOut() { if (fbAuth) fbAuth.signOut(); },
};
// Salva o cadastro (nome de exibição) da conta. Se falhar, desfaz o login para não deixar conta pela metade.
async function saveProfile(key, name, user) {
  try { await db.doc('contas/' + key).set({ name, uid: user.uid, createdAt: Date.now() }); }
  catch (e) { try { await fbAuth.signOut(); } catch {} throw { code: 'save', raw: 'firestore/' + (e && e.code === 'invalid_argument' ? 'permission-denied' : 'unavailable') }; }
}
// Cadastro que ainda aponta para um login antigo (apagado ao zerar): atualiza para o login atual.
async function syncProfile(key, data, user) {
  if (data.uid !== user.uid) await saveProfile(key, data.name || key, user);
  return data.name || key;
}
function mapAuthError(e) {
  const c = (e && e.code) || '';
  if (c === 'auth/email-already-in-use') return 'exists';
  if (c === 'auth/user-not-found') return 'not_found';
  if (c === 'auth/wrong-password' || c === 'auth/invalid-credential' || c === 'auth/invalid-login-credentials') return 'wrong';
  if (c === 'auth/too-many-requests') return 'too_many';
  if (c === 'auth/operation-not-allowed') return 'setup';
  if (c === 'auth/network-request-failed') return 'unavailable';
  return 'unavailable';
}
const AUTH_MSG = {
  exists: 'Esse usuário já existe. Escolha outro nome ou entre com ele.',
  not_found: 'Usuário não encontrado. Confira o nome ou crie a conta.',
  wrong: 'Usuário ou senha errados.',
  too_many: 'Muitas tentativas erradas. Espere uns minutos e tente de novo.',
  setup: 'O login por e-mail e senha ainda não foi ligado no Firebase.',
  unavailable: 'Não deu para entrar agora. Confira a internet e tente de novo.',
  save: 'O login deu certo, mas não deu para salvar o cadastro. Confira se as regras do Firestore foram publicadas.',
};

let db = null, myId = null, canWrite = true, localMode = false;
let cur = null, code = null, unsubTable = null, unsubList = null, busy = false, cover = false;
let myNick = '', account = null, unsubRank = null;
const CHIP_VALUES = [1, 2, 5, 10, 20, 50, 100];
try { account = JSON.parse(localStorage.getItem('truco:conta') || 'null'); } catch {}
if (account) { myId = account.key; myNick = account.name; }

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3200);
}
function setNotice(html) { const n = document.getElementById('notice'); n.innerHTML = html || ''; n.hidden = !html; }

async function init() {
  if (window.FIREBASE_CONFIG && window.firebase) {
    firebase.initializeApp(window.FIREBASE_CONFIG);
    db = fsDb(firebase.firestore());
    fbAuth = firebase.auth();
    const user = await new Promise(res => { const off = fbAuth.onAuthStateChanged(u => { off(); res(u); }); });
    account = null; myId = null; myNick = '';
    if (user && user.email) {
      const key = user.email.split('@')[0];
      try { const s = await db.doc('contas/' + key).get(); myNick = s.exists ? s.data().name : key; } catch { myNick = key; }
      account = { key, name: myNick }; myId = key;
    }
  } else {
    localMode = true;
    db = mockDb();
    // no teste local cada aba guarda sua própria conta, para simular vários jogadores
    try { account = JSON.parse(sessionStorage.getItem('truco:conta') || 'null'); } catch { account = null; }
    myId = account ? account.key : null; myNick = account ? account.name : '';
    setNotice('Modo de teste local: o Firebase ainda não foi configurado, então os dados ficam só neste navegador. Abra outras abas para simular os outros jogadores.');
  }
  startPayments();
  const h = location.hash.replace('#', '').toUpperCase();
  if (h && /^[A-Z0-9]{4,8}$/.test(h)) openTable(h); else showLobby();
}

const tableRef = c => db.doc('mesas/' + c);

async function commit(fn) {
  if (solo && cur) {
    const st = structuredClone(cur);
    if (fn(st) === false) return;
    cur = st; render(); scheduleBot();
    return;
  }
  if (!cur || busy) return;
  if (!canWrite) return toast('Você está só assistindo.');
  const st = structuredClone(cur);
  const prevPhase = cur.phase;
  if (fn(st) === false) return;
  if (st.phase === 'gameEnd' && prevPhase !== 'gameEnd') st.closedAt = Date.now(); // mesa encerra com a partida
  st.v = (st.v || 0) + 1;
  st.updatedAt = Date.now();
  st.turnAt = st.updatedAt; // começa a contar o tempo da próxima jogada
  st.aliveAt = st.updatedAt;
  busy = true; render();
  try {
    await tableRef(code).set(st);
    if (st.phase === 'gameEnd' && prevPhase !== 'gameEnd') { recordGame(st); clearChat(st.code); }
  }
  catch (e) { toast(e && e.code === 'invalid_argument' ? 'Sem permissão para jogar nesta mesa.' : 'Não deu para salvar a jogada. Tente de novo.'); }
  finally { busy = false; render(); }
}

/* =========================================================
   TREINO CONTRA O COMPUTADOR — nada vai para o banco
   ========================================================= */
let solo = false, botTimer = null, realId = null;
const BOT_NAMES = ['Tião', 'Zefa', 'Dito', 'Nena', 'Juca'];

function startSolo(n) {
  if (unsubList) { unsubList(); unsubList = null; }
  if (unsubTable) { unsubTable(); unsubTable = null; }
  solo = true; realId = myId; myId = 'voce'; code = 'TREINO'; cover = false;
  const seats = Array.from({ length: n }, (_, i) => (i === 0 ? myId : 'bot' + i));
  const names = { [myId]: myNick || 'Você' };
  seats.slice(1).forEach((id, i) => (names[id] = 'Robô ' + BOT_NAMES[i]));
  const st = {
    v: 1, code: 'TREINO', n, stake: 10, owner: myId,
    seats, names, phase: 'lobby', score: [0, 0], dealer: randInt(n), hand: null, result: null,
    games: [], balances: Object.fromEntries(seats.map(id => [id, 0])), gameNo: 1, log: [],
  };
  addLog(st, 'Treino contra o computador começou.');
  deal(st);
  cur = st;
  render(); scheduleBot();
}

function leaveSolo() {
  clearTimeout(botTimer);
  if (solo) { solo = false; myId = realId; }
}

function scheduleBot() {
  clearTimeout(botTimer);
  if (!solo || !cur || !cur.hand) return;
  const st = cur, h = st.hand;
  if (st.phase === 'handEnd') {
    const dealer = (st.dealer + 1) % st.n;
    botTimer = setTimeout(() => act('next', dealer), DEAL_MS); // no treino as cartas também saem sozinhas
    return;
  }
  const actor = st.phase === 'truco' ? h.pending.responder : st.phase === 'onze' ? h.onzeDecider : st.phase === 'play' ? h.turn : -1;
  if (actor < 0 || st.seats[actor] === myId) return;
  botTimer = setTimeout(() => botMove(actor), st.phase === 'truco' ? 1300 : 850);
}

// Qualidade da mão do robô: manilhas valem 2, cartas 2 e 3 valem 1, vazas já feitas/perdidas pesam ±1.
function botQuality(st, s) {
  const h = st.hand, t = team(s);
  let q = 0;
  for (const c of h.hands[s]) { const v = strength(c, h.vira); if (v >= 100) q += 2; else if (v >= 8) q += 1; }
  for (const w of h.rw) { if (w === t) q += 1; else if (w >= 0) q -= 1; }
  return q;
}

function botMove(s) {
  const st = cur, h = st.hand, rnd = Math.random();
  const q = botQuality(st, s);
  if (st.phase === 'onze') return act(q >= 2 ? 'onzePlay' : 'onzeRun', s);
  if (st.phase === 'truco') {
    const p = h.pending;
    if (p.to < 12 && q >= 4 && rnd < 0.5) return act('raise', s);
    if (q >= 2 || (q >= 1 && rnd < 0.4)) return act('accept', s);
    return act('run', s);
  }
  if (st.phase !== 'play' || h.turn !== s) return;
  if (canCallTruco(st, s) && ((q >= 3 && rnd < 0.5) || rnd < 0.07)) return act('truco', s);
  const sorted = h.hands[s].map((c, i) => ({ i, v: strength(c, h.vira) })).sort((a, b) => a.v - b.v);
  const plays = h.played[h.rw.length];
  let pick;
  if (!plays.length) {
    pick = h.rw.length === 0 && sorted.length === 3 ? sorted[1] : sorted[sorted.length - 1];
  } else {
    const str = p => (p.covered ? -1 : strength(p.card, h.vira));
    const best = Math.max(...plays.map(str));
    const winningTeam = team(plays.find(p => str(p) === best).seat);
    if (winningTeam === team(s)) pick = sorted[0];
    else pick = sorted.find(x => x.v > best) || sorted.find(x => x.v === best) || sorted[0];
  }
  commit(x => { if (x.phase !== 'play' || x.hand.turn !== s) return false; playCard(x, s, pick.i, false); });
}

function showLobby() {
  document.body.classList.remove('in-game');

  $app.innerHTML = `

            <select id="stake">${chipOpts}</select>

/* =========================================================
   CONTAS — usuário + senha de 4 números
   ========================================================= */
const userKey = name => name.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9_-]/g, '');
async function pinHash(salt, pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('truco:' + salt + ':' + pin));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function saveAccount() {
  const store = localMode ? sessionStorage : localStorage;
  try { account ? store.setItem('truco:conta', JSON.stringify(account)) : store.removeItem('truco:conta'); } catch {}
}
// Tela de login: "Já tenho conta" e "Criar conta nova" ficam separados, e o erro aparece fixo embaixo do formulário.
let loginMode = 'in';
function setLoginMode(mode) {
  loginMode = mode;
  const isNew = mode === 'new';
  document.querySelectorAll('[data-lgmode]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.lgmode === mode)));
  document.getElementById('lgTitle').textContent = isNew ? 'Criar conta' : 'Entrar';
  document.getElementById('lgHelp').textContent = isNew
    ? 'Escolha um nome de usuário e uma senha de 4 números. Suas vitórias e fichas ficam guardadas nele para o ranking.'
    : 'Entre com seu usuário e sua senha de 4 números.';
  document.getElementById('lgPin2Wrap').hidden = !isNew;
  document.getElementById('lgPin').autocomplete = isNew ? 'new-password' : 'current-password';
  document.getElementById('lgEnter').textContent = isNew ? 'Criar conta' : 'Entrar';
  loginError('');
}
function loginError(msg) {
  const el = document.getElementById('lgError');
  if (!el) { if (msg) toast(msg); return; }
  el.textContent = msg; el.hidden = !msg;
}
async function login(create) {
  const name = document.getElementById('lgName').value.trim().replace(/\s+/g, ' ');
  const pin = document.getElementById('lgPin').value.trim();
  const key = userKey(name);
  if (key.length < 3) return loginError('O usuário precisa ter pelo menos 3 letras ou números.');
  if (!/^\d{4}$/.test(pin)) return loginError('A senha tem que ter exatamente 4 números.');
  if (create && document.getElementById('lgPin2').value.trim() !== pin) return loginError('As duas senhas não são iguais.');
  loginError('');
  const btn = document.getElementById('lgEnter'); btn.disabled = true; btn.textContent = create ? 'Criando…' : 'Entrando…';
  const done = () => { btn.disabled = false; btn.textContent = create ? 'Criar conta' : 'Entrar'; };
  try {
    const shown = create ? await authApi.create(key, name, pin) : await authApi.signIn(key, pin);
    if (create) toast(`Conta ${name} criada.`);
    account = { key, name: shown };
    myId = key; myNick = shown;
    saveAccount();
    startPayments();
    loginMode = 'in';
    showLobby();
  } catch (e) {
    done();
    loginError((AUTH_MSG[e && e.code] || AUTH_MSG.unavailable) + (e && e.raw ? ` (código: ${e.raw})` : ''));
  }
}
function logout() {
  authApi.signOut();
  account = null; myId = null; myNick = '';
  loginMode = 'in';
  stopPayments();
  saveAccount();
  showLobby();
}

/* =========================================================
   CHAVE PIX E PAGAMENTOS
   O jogo só mostra a chave e anota quem pagou. O Pix é feito por vocês, no app do banco.

// Só chave aleatória (formato 1a2b3c4d-1a2b-1a2b-1a2b-1a2b3c4d5e6f), para ninguém expor CPF, celular ou e-mail.
const PIX_RANDOM = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const pixCache = {};           // usuário -> {nome, tipo, chave} | null
const pixLoading = new Set();
let payTo = [], payFrom = [], unsubPayTo = null, unsubPayFrom = null;
const overlayShown = new Set();

function loadPix(id) {
  if (id in pixCache || pixLoading.has(id) || !db) return;
  pixLoading.add(id);
  db.doc('pix/' + id).get().then(s => {
    pixCache[id] = s.exists ? s.data() : null;
  }).catch(() => { pixCache[id] = null; }).finally(() => {
    pixLoading.delete(id);
    renderPayments(); renderPixPanel(); refreshOverlayPix();
  });
}

function pixBlock(id, who) {
  if (!(id in pixCache)) { loadPix(id); return '<p class="muted">Buscando a chave Pix…</p>'; }
  const p = pixCache[id];
  if (!p || !p.chave) return `<p class="muted">${esc(who)} ainda não cadastrou a chave Pix.</p>`;
  return `<dl class="pix">
    <dt>Nome</dt><dd>${esc(p.nome)}</dd>
    <dt>Tipo</dt><dd>${esc(p.tipo)}</dd>
    <dt>Chave</dt><dd class="pix-key"><span class="key-text">${esc(p.chave)}</span><button type="button" class="small primary" data-copy="${esc(p.chave)}">Copiar</button></dd>
  </dl>`;
}

// copiar a chave (qualquer botão com data-copy)
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const text = b.dataset.copy;
  const fallback = () => {
    const span = b.parentElement.querySelector('.key-text');
    if (span) { const r = document.createRange(); r.selectNodeContents(span); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    toast('Chave selecionada. Use Ctrl+C (ou segure e copie no celular).');
  };
  try { navigator.clipboard.writeText(text).then(() => toast('Chave Pix copiada.'), fallback); } catch { fallback(); }
});

function renderPixPanel() {
  const el = document.getElementById('pixPanel');
  if (!el) return;
  if (!db) { el.innerHTML = '<h2>Chave Pix</h2><p class="muted">Sem conexão com o banco de dados.</p>'; return; }
  if (!account) { el.innerHTML = '<h2>Chave Pix</h2><p class="muted">Entre com seu usuário para cadastrar a chave Pix onde você recebe.</p>'; return; }
  if (!(myId in pixCache)) { loadPix(myId); el.innerHTML = '<h2>Chave Pix</h2><p class="muted">Carregando…</p>'; return; }
  const p = pixCache[myId] || {};
  const editing = el.dataset.editing === '1' || !p.chave;
  if (!editing) {
    el.innerHTML = `<h2>Chave Pix</h2>${pixBlock(myId, 'Você')}<div class="row"><button id="pixEdit">Trocar chave</button></div>`;
    document.getElementById('pixEdit').onclick = () => { el.dataset.editing = '1'; renderPixPanel(); };
    return;
  }
  el.innerHTML = `<h2>Chave Pix</h2>
    <p class="muted">É a chave que aparece para quem perder de você. Só vale chave aleatória: crie uma no app do seu banco, na área Pix.</p>
    <form id="pixForm" class="row">
      <label style="flex:2 1 180px">Nome (titular da conta)<input id="pxNome" maxlength="60" value="${esc(p.nome || '')}" placeholder="Como aparece no banco"></label>
      <div class="fixed-type"><span>Tipo</span><b>Aleatória</b></div>
      <label style="flex:3 1 100%">Chave aleatória<input id="pxChave" maxlength="36" value="${esc(p.chave || '')}" placeholder="Ex.: 1a2b3c4d-1a2b-1a2b-1a2b-1a2b3c4d5e6f" autocomplete="off" spellcheck="false"></label>
      <label style="flex:1 1 140px">Sua senha (4 números)<input id="pxPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></label>
      <div class="row" style="flex:1 1 100%"><button class="primary" type="submit">Salvar chave</button>${p.chave ? '<button type="button" id="pxCancel">Cancelar</button>' : ''}</div>
    </form>`;
  document.getElementById('pixForm').onsubmit = e => { e.preventDefault(); savePix(); };
  const c = document.getElementById('pxCancel');
  if (c) c.onclick = () => { el.dataset.editing = ''; renderPixPanel(); };
}

async function savePix() {
  const nome = document.getElementById('pxNome').value.trim();
  const tipo = 'Aleatória';
  const chave = document.getElementById('pxChave').value.trim().toLowerCase();
  const pin = document.getElementById('pxPin').value.trim();
  if (!nome || !chave) return toast('Preencha o nome e a chave.');
  if (!PIX_RANDOM.test(chave)) return toast('Essa não é uma chave aleatória. Ela tem 32 letras e números separados por traços, como 1a2b3c4d-1a2b-1a2b-1a2b-1a2b3c4d5e6f.');
  if (!/^\d{4}$/.test(pin)) return toast('Digite sua senha de 4 números para salvar.');
  try {
    try { await authApi.verifyPin(pin); } catch { return toast('Senha errada.'); }
    const data = { nome, tipo, chave, updatedAt: Date.now() };
    await db.doc('pix/' + myId).set(data);
    pixCache[myId] = data;
    document.getElementById('pixPanel').dataset.editing = '';
    renderPixPanel();
    toast('Chave Pix salva.');
  } catch { toast('Não deu para salvar a chave agora. Tente de novo.'); }
}

function startPayments() {
  stopPayments();
  if (!db || !account) return;
  const col = db.collection('pagamentos');
  const done = side => snap => { const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.at - a.at).slice(0, 50); if (side === 'to') payTo = list; else payFrom = list; renderPayments(); };
  unsubPayTo = col.where('to', '==', myId).onSnapshot(done('to'), () => {});
  unsubPayFrom = col.where('from', '==', myId).onSnapshot(done('from'), () => {});
}
function stopPayments() {
  if (unsubPayTo) unsubPayTo(); if (unsubPayFrom) unsubPayFrom();
  unsubPayTo = unsubPayFrom = null; payTo = []; payFrom = [];
}

const shortDate = t => new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

async function confirmPayment(id) {
  const p = payTo.find(x => x.id === id);
  if (!p || p.to !== myId) return;
  try { await db.doc('pagamentos/' + id).update({ status: 'recebido', confirmedAt: Date.now() }); toast('Pagamento confirmado.'); }
  catch { toast('Não deu para confirmar agora. Tente de novo.'); }
}

// Fim da partida: quem perdeu vê a tela grande com a chave de quem ganhou.
function maybeShowPayOverlay(st) {
  if (solo || st.phase !== 'gameEnd' || !account) return;
  const g = st.games[0]; if (!g) return;
  const key = st.code + '-' + g.n;
  if (overlayShown.has(key)) return;

/* =========================================================
   FOTO DE PERFIL — guardada pequena (128 px) junto com a conta
   ========================================================= */
const photoCache = {};          // usuário -> data URL | null
const photoLoading = new Set();
const PHOTO_PX = 128;

function loadPhoto(id) {
  if (!id || id in photoCache || photoLoading.has(id) || !db || /^(bot\d+|voce)$/.test(id)) return; // robôs do treino não têm foto
  photoLoading.add(id);
  db.doc('fotos/' + id).get().then(s => { photoCache[id] = s.exists ? s.data().img || null : null; })
    .catch(() => { photoCache[id] = null; })
    .finally(() => { photoLoading.delete(id); if (cur) render(); renderPhotoPanel(); });
}

function initials(name) { return (name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }
function avatarHtml(id, name) {
  const key = solo && id === myId ? realId : id;
  if (key && !(key in photoCache)) loadPhoto(key);
  const img = key && photoCache[key];
  return img
    ? `<img class="avatar" src="${img}" alt="${esc(name)}">`
    : `<span class="avatar ph" aria-hidden="true">${esc(initials(name))}</span>`;
}

// Recorta no centro, reduz para 128x128 e salva como JPEG pequeno.
function shrinkPhoto(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('tipo'));
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const side = Math.min(im.naturalWidth, im.naturalHeight);
      const c = document.createElement('canvas'); c.width = c.height = PHOTO_PX;
      c.getContext('2d').drawImage(im, (im.naturalWidth - side) / 2, (im.naturalHeight - side) / 2, side, side, 0, 0, PHOTO_PX, PHOTO_PX);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('leitura')); };
    im.src = url;
  });
}

async function savePhoto(file) {
  try {
    const img = await shrinkPhoto(file);
    await db.doc('fotos/' + myId).set({ img, updatedAt: Date.now() });
    photoCache[myId] = img;
    renderPhotoPanel();
    toast('Foto de perfil salva.');
  } catch (e) {
    toast(e && e.message === 'tipo' ? 'Escolha um arquivo de imagem (JPG, PNG…).' : 'Não deu para usar essa imagem. Tente outra.');
  }
}
async function removePhoto() {
  try { await db.doc('fotos/' + myId).delete(); photoCache[myId] = null; renderPhotoPanel(); toast('Foto removida.'); }
  catch { toast('Não deu para remover agora. Tente de novo.'); }
}

function renderPhotoPanel() {
  const el = document.getElementById('photoPanel');
  if (!el) return;
  if (!db || !account) { el.innerHTML = '<h2>Foto de perfil</h2><p class="muted">Entre com seu usuário para colocar uma foto. Ela aparece em cima das suas cartas na mesa.</p>'; return; }
  if (!(myId in photoCache)) { loadPhoto(myId); el.innerHTML = '<h2>Foto de perfil</h2><p class="muted">Carregando…</p>'; return; }
  const has = !!photoCache[myId];
  el.innerHTML = `<h2>Foto de perfil</h2>
    <div class="photo-row">
      <span class="avatar-big">${avatarHtml(myId, myNick)}</span>
      <div class="photo-actions">
        <p class="muted">Aparece em cima das suas cartas na mesa. A imagem é cortada em quadrado.</p>
        <div class="row">
          <label class="file-btn"><input type="file" id="photoFile" accept="image/*">${has ? 'Trocar foto' : 'Escolher foto'}</label>
          ${has ? '<button type="button" id="photoRemove">Remover</button>' : ''}
        </div>
      </div>
    </div>`;
  document.getElementById('photoFile').onchange = e => { const f = e.target.files[0]; if (f) savePhoto(f); };
  const rm = document.getElementById('photoRemove'); if (rm) rm.onclick = removePhoto;
}

/* =========================================================
   LUCRO — quanto cada um ganhou e perdeu por período
   ========================================================= */
let allGames = null;
const PERIODS = [['hoje', 'Hoje'], ['semana', 'Nesta semana'], ['mes', 'Neste mês']];
let profitPeriod = 'hoje';
try { const v = localStorage.getItem('truco:lucro'); if (PERIODS.some(p => p[0] === v)) profitPeriod = v; } catch {}

function periodStart(key) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (key === 'hoje') return d.getTime();
  if (key === 'semana') { const back = (d.getDay() + 6) % 7; d.setDate(d.getDate() - back); return d.getTime(); } // semana começa na segunda
  if (key === 'mes') { d.setDate(1); return d.getTime(); }
  return 0;
}

function profitFor(id, since) {
  let won = 0, lost = 0, wins = 0, losses = 0;
  for (const g of allGames || []) {
    if (g.at < since) continue;
    if (g.winners.includes(id)) { won += g.value; wins++; }
    else if (g.losers.includes(id)) { lost += g.value; losses++; }
  }
  return { won, lost, net: won - lost, wins, losses };
}

/* =========================================================
   RANKING — calculado a partir das partidas registradas
   ========================================================= */
async function recordGame(st) {
  const g = st.games[0];
  if (!g) return;
  const winners = [], losers = [];
  st.seats.forEach((id, s) => { if (id) (team(s) === g.winner ? winners : losers).push(id); });
  const names = {};
  for (const id of [...winners, ...losers]) names[id] = st.names[id] || id;
  try {
    await db.doc('partidas/' + st.code + '-' + g.n).set({ at: g.at, table: st.code, value: st.stake, winners, losers, names, score: g.score });
  } catch { toast('A partida acabou, mas não deu para registrar no ranking.'); }
  // cada perdedor paga um vencedor, na ordem das cadeiras
  for (let i = 0; i < losers.length; i++) {
    const from = losers[i], to = winners[i % winners.length];
    try {
      await db.doc('pagamentos/' + st.code + '-' + g.n + '-' + from).set({
        at: g.at, table: st.code, game: g.n, from, to, value: st.stake, names: { [from]: names[from], [to]: names[to] }, status: 'pendente',
      });
    } catch {}
  }
}

function computeRanking(games) {
  games = [...games].sort((a, b) => a.at - b.at);
  const players = {}, h2h = {}, names = {};
  const P = id => (players[id] ||= { id, wins: 0, played: 0, saldo: 0 });
  for (const g of games) {
    Object.assign(names, g.names || {});
    for (const w of g.winners) { const p = P(w); p.wins++; p.played++; p.saldo += g.value; }
    for (const l of g.losers) { const p = P(l); p.played++; p.saldo -= g.value; }
    for (const w of g.winners) for (const l of g.losers) {
      const [a, b] = [w, l].sort();
      const r = (h2h[a + '|' + b] ||= { a, b, wins: { [a]: 0, [b]: 0 }, last: null, streak: 0 });
      r.wins[w]++;
      if (r.last === w) r.streak++; else { r.last = w; r.streak = 1; }
    }
  }
  const ranking = Object.values(players).sort((x, y) => y.wins - x.wins || y.saldo - x.saldo || x.played - y.played);
  const patos = [];
  for (const r of Object.values(h2h)) {
    const wa = r.wins[r.a], wb = r.wins[r.b];
    if (wa === wb) continue;
    const pai = wa > wb ? r.a : r.b, pato = pai === r.a ? r.b : r.a;
    patos.push({ pai, pato, paiWins: r.wins[pai], patoWins: r.wins[pato], diff: Math.abs(wa - wb), streak: r.last === pai ? r.streak : 0 });
  }
  patos.sort((x, y) => y.diff - x.diff || y.paiWins - x.paiWins || y.streak - x.streak);
  return { ranking, patos, names, total: games.length };
}

  pod.innerHTML = `<h2>Ranking</h2>

}

/* =========================================================
   CONVERSA DA MESA — texto + voz ao vivo (segura para falar, como rádio)
   O texto fica no banco só durante a partida e é apagado no fim.
   A voz vai direto de um aparelho para o outro (WebRTC); o banco só guarda
   o "aperto de mão" da conexão, que também é apagado no fim.
   ========================================================= */
const CHAT_MAX_TEXT = 200;
let chatMsgs = [], unsubChat = null, chatCode = null, chatOpenedAt = 0, chatUnread = 0, chatSheetOpen = false, lastChatSend = 0;
const chatCleared = new Set();

function startChat(c) {
  stopChat();
  if (!db || solo) return;
  chatCode = c; chatOpenedAt = Date.now(); chatUnread = 0;
  unsubChat = db.collection('chat').where('table', '==', c).onSnapshot(snap => {
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => m.text).sort((a, b) => a.at - b.at);
    const known = new Set(chatMsgs.map(m => m.id));
    const fresh = list.filter(m => !known.has(m.id) && m.at >= chatOpenedAt && m.from !== myId);
    chatMsgs = list;
    onNewChat(fresh);
    renderChat();
  }, () => {});
}
function stopChat() {
  if (unsubChat) unsubChat();
  unsubChat = null; chatMsgs = []; chatCode = null; chatUnread = 0;
  chatSheetOpen = false; document.body.classList.remove('chat-open');
  stopVoice();
}

const isPhoneLayout = () => matchMedia('(max-width: 860px)').matches;
function onNewChat(fresh) {
  if (!fresh.length || !(isPhoneLayout() && !chatSheetOpen)) return;
  chatUnread += fresh.length;
  const m = fresh[fresh.length - 1];
  chatBubble(`${m.name || 'Alguém'}: ${m.text}`);
}
function chatBubble(text) {
  let el = document.getElementById('chatBubble');
  if (!el) { el = document.createElement('div'); el.id = 'chatBubble'; document.body.appendChild(el); el.onclick = () => openChatSheet(true); }
  el.textContent = text; el.hidden = false;
  clearTimeout(chatBubble.t); chatBubble.t = setTimeout(() => (el.hidden = true), 4000);
}

const canChat = () => !!(cur && !solo && account && db && mySeat() >= 0 && cur.phase !== 'lobby' && cur.phase !== 'gameEnd');

// guarda o que está sendo digitado, porque a mesa é redesenhada a cada jogada
let chatDraft = '', chatHadFocus = false;
function saveChatDraft() {

function bindChat() {

function openChatSheet(open) {

const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
async function sendChatText() {
  const i = document.getElementById('chatInput');
  const text = (i ? i.value : '').trim().slice(0, CHAT_MAX_TEXT);
  if (!text) return;
  if (!canChat()) return toast('A conversa só funciona durante a partida.');
  if (Date.now() - lastChatSend < 700) return toast('Calma, uma mensagem por vez.');
  lastChatSend = Date.now();
  chatDraft = ''; if (i) i.value = '';
  try { await db.collection('chat').doc(chatCode + '-' + rid()).set({ table: chatCode, from: myId, name: myNick, at: Date.now(), text }); }
  catch { toast('Não deu para enviar. Tente de novo.'); }

/* ---------------- VOZ AO VIVO ----------------
   Cada par de jogadores abre uma ligação direta. Quem tem o nome "menor" chama,
   o outro atende. O microfone só manda som enquanto o botão está apertado. */
const ICE_SERVERS = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }, ...(window.TURN_SERVERS || [])];
const voiceOK = () => !!(window.RTCPeerConnection && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && (localMode || !window.claude);
let vz = null;          // { code, session, peers: {key: {pc, offerId, remoteSession, audio, answered}}, talking: {}, unsub }
let micStream = null, micTrack = null, pttDown = false, pttPressedAt = 0, micReleasedAt = 0;

const vozId = (...parts) => [vz.code, ...parts].join('-');
function writeVoz(id, body) { return db.collection('voz').doc(id).set({ table: vz.code, from: myId, at: Date.now(), ...body }).catch(() => {}); }

function startVoice(c) {
  stopVoice();
  if (!voiceOK() || solo || !db || !account || mySeat() < 0) return;
  vz = { code: c, session: rid(), peers: {}, talking: {} };
  writeVoz(vozId(myId), { kind: 'hello', session: vz.session, talking: false });
  vz.unsub = db.collection('voz').where('table', '==', c).onSnapshot(snap => onVozDocs(snap.docs.map(d => ({ id: d.id, ...d.data() }))), () => {});
}
function stopVoice() {
  pttRelease();
  if (!vz) return;
  const v = vz; vz = null;
  if (v.unsub) v.unsub();
  for (const k in v.peers) closePeer(v.peers[k]);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = micTrack = null;
  // apaga o que esta pessoa deixou no banco para a ligação
  db.collection('voz').where('table', '==', v.code).get().then(s => s.docs.forEach(d => { if (d.data().from === myId) db.collection('voz').doc(d.id).delete().catch(() => {}); })).catch(() => {});
}
function closePeer(p) {
  try { p.pc.close(); } catch {}
  if (p.audio) p.audio.remove();
}

function onVozDocs(docs) {
  if (!vz || !cur) return;
  const others = cur.seats.filter(k => k && k !== myId);
  for (const d of docs) {
    if (!others.includes(d.from)) continue;
    if (d.kind === 'hello') {
      vz.talking[d.from] = !!d.talking;
      const p = vz.peers[d.from];
      if (myId < d.from && (!p || p.remoteSession !== d.session)) makeOffer(d.from, d.session);
    } else if (d.kind === 'offer' && d.to === myId && d.from < myId) {
      const p = vz.peers[d.from];
      if (!p || p.offerId !== d.offerId) answerOffer(d);
    } else if (d.kind === 'answer' && d.to === myId) {
      const p = vz.peers[d.from];
      if (p && p.offerId === d.offerId && !p.answered) {
        p.answered = true;
        p.pc.setRemoteDescription({ type: 'answer', sdp: d.sdp }).catch(() => {});
      }
    }
  }
  applyTalking();
  renderChat();
}

function newPeer(key) {
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const p = { pc, key, state: 'conectando' };
  pc.ontrack = e => {
    if (!p.audio) { p.audio = document.createElement('audio'); p.audio.autoplay = true; p.audio.playsInline = true; p.audio.setAttribute('playsinline', ''); document.body.appendChild(p.audio); }
    p.audio.srcObject = e.streams[0] || new MediaStream([e.track]);
    p.audio.play().catch(() => {});
  };
  pc.onconnectionstatechange = () => {
    p.state = { connected: 'conectado', failed: 'falhou', disconnected: 'caiu', closed: 'fechado' }[pc.connectionState] || 'conectando';
    renderChat();
  };
  return p;
}
const waitIce = pc => new Promise(res => {
  if (pc.iceGatheringState === 'complete') return res();
  const t = setTimeout(res, 2500);
  pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
});
async function makeOffer(to, remoteSession) {
  if (vz.peers[to]) closePeer(vz.peers[to]);
  const p = newPeer(to);
  p.offerId = rid(); p.remoteSession = remoteSession;
  vz.peers[to] = p;
  const tr = p.pc.addTransceiver('audio', { direction: 'sendrecv' });
  if (micTrack) tr.sender.replaceTrack(micTrack);
  try {
    await p.pc.setLocalDescription(await p.pc.createOffer());
    await waitIce(p.pc);
    if (vz && vz.peers[to] === p) writeVoz(vozId(myId, to, 'o'), { kind: 'offer', to, offerId: p.offerId, sdp: p.pc.localDescription.sdp });
  } catch { p.state = 'falhou'; }
}
async function answerOffer(d) {
  if (vz.peers[d.from]) closePeer(vz.peers[d.from]);
  const p = newPeer(d.from);
  p.offerId = d.offerId;
  vz.peers[d.from] = p;
  try {
    await p.pc.setRemoteDescription({ type: 'offer', sdp: d.sdp });
    const tr = p.pc.getTransceivers()[0];
    if (tr) { tr.direction = 'sendrecv'; if (micTrack) await tr.sender.replaceTrack(micTrack); }
    await p.pc.setLocalDescription(await p.pc.createAnswer());
    await waitIce(p.pc);
    if (vz && vz.peers[d.from] === p) writeVoz(vozId(myId, d.from, 'a'), { kind: 'answer', to: d.from, offerId: d.offerId, sdp: p.pc.localDescription.sdp });
  } catch { p.state = 'falhou'; }
}

// segurar para falar
async function ensureMic() {
  if (micTrack) return true;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch { toast('Libere o microfone para falar (nas permissões do navegador).'); return false; }
  micTrack = micStream.getAudioTracks()[0];
  micTrack.enabled = false;
  if (vz) for (const k in vz.peers) { const tr = vz.peers[k].pc.getTransceivers()[0]; if (tr) tr.sender.replaceTrack(micTrack).catch(() => {}); }
  return true;
}
async function pttPress() {
  if (pttDown || !vz || !canChat()) return;
  pttDown = true; pttPressedAt = Date.now();
  window.addEventListener('pointerup', pttRelease, { once: true });
  window.addEventListener('pointercancel', pttRelease, { once: true });
  document.querySelectorAll('[data-ptt]').forEach(b => b.classList.add('on'));
  const firstTime = !micTrack;
  if (!(await ensureMic())) return pttRelease();
  if (micReleasedAt > pttPressedAt) { if (firstTime) toast('Microfone liberado. Agora segure 🎤 para falar.'); return; } // soltou enquanto pedia permissão
  micTrack.enabled = true;
  writeVoz(vozId(myId), { kind: 'hello', session: vz.session, talking: true });
}
function pttRelease() {
  micReleasedAt = Date.now();
  if (!pttDown) return;
  pttDown = false;
  if (micTrack) micTrack.enabled = false;
  document.querySelectorAll('[data-ptt]').forEach(b => b.classList.remove('on'));
  if (vz) writeVoz(vozId(myId), { kind: 'hello', session: vz.session, talking: false });
}

// o iPhone só toca o som da ligação depois de um toque na tela
document.addEventListener('pointerdown', () => { if (vz) for (const k in vz.peers) vz.peers[k].audio?.play().catch(() => {}); });

function voiceStatusText() {
  if (!voiceOK()) return 'Voz ao vivo só no site do jogo. Tudo some quando a partida acaba.';
  if (!vz) return 'Tudo some quando a partida acaba.';
  const ps = Object.values(vz.peers);
  if (!ps.length) return 'Voz: esperando os outros jogadores… Segure 🎤 Falar para falar.';
  const name = k => (cur && cur.names[k]) || k;
  const bad = ps.filter(p => p.state === 'falhou' || p.state === 'caiu');
  const ok = ps.filter(p => p.state === 'conectado');
  let t = ok.length ? `Voz conectada com ${ok.map(p => name(p.key)).join(', ')}.` : 'Voz: conectando…';
  if (bad.length) t += ` Não conectou com ${bad.map(p => name(p.key)).join(', ')} (no 4G/5G às vezes não conecta; no Wi-Fi costuma funcionar).`;
  return t + ' Segure 🎤 Falar para falar.';
}
// quem está falando ganha destaque na mesa
function applyTalking() {

    const k = el.dataset.key;
