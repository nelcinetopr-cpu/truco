/* =========================================================
   CONVERSA DA MESA — texto + voz ao vivo (segura para falar, como rádio)
   O texto fica no banco só durante a partida e é apagado no fim.
   A voz vai direto de um aparelho para o outro (WebRTC); o banco só guarda
   o "aperto de mão" da conexão, que também é apagado no fim.
   ========================================================= */
const CHAT_MAX_TEXT = 200;
let chatMsgs = [], unsubChat = null, chatCode = null, chatOpenedAt = 0, chatUnread = 0, chatSheetOpen = false, lastChatSend = 0;
const chatCleared = new Set();

function startChat(c) {
  stopChat();
  if (!db || solo) return;
  chatCode = c; chatOpenedAt = Date.now(); chatUnread = 0;
  unsubChat = db.collection('chat').where('table', '==', c).onSnapshot(snap => {
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => m.text).sort((a, b) => a.at - b.at);
    const known = new Set(chatMsgs.map(m => m.id));
    const arrived = list.filter(m => !known.has(m.id) && m.at >= chatOpenedAt);
    chatMsgs = list;
    for (const m of arrived) showSpeech(m.from, m.text);
    onNewChat(arrived.filter(m => m.from !== myId));
    renderChat();
  }, () => {});
}
function stopChat() {
  if (unsubChat) unsubChat();
  unsubChat = null; chatMsgs = []; chatCode = null; chatUnread = 0;
  chatSheetOpen = false; document.body.classList.remove('chat-open');
  stopVoice();
}

const isPhoneLayout = () => matchMedia('(max-width: 860px)').matches;
function onNewChat(fresh) {
  if (!fresh.length || !(isPhoneLayout() && !chatSheetOpen)) return;
  chatUnread += fresh.length; // a mensagem já aparece no balão em cima da foto
}

// Balão de fala: a mensagem aparece em cima da foto de quem mandou, por 3 segundos.
const SPEECH_MS = 3000;
const speech = {}; // usuário -> { text, until }
function showSpeech(key, text) {
  if (!key || !text) return;
  speech[key] = { text: text.length > 90 ? text.slice(0, 88) + '…' : text, until: Date.now() + SPEECH_MS };
  applySpeech();
  setTimeout(applySpeech, SPEECH_MS + 50);
}
function applySpeech() {
  const now = Date.now();
  document.querySelectorAll('.seat[data-key]').forEach(el => {
    const s = speech[el.dataset.key];
    let b = el.querySelector('.speech');
    if (!s || s.until <= now) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement('div'); b.className = 'speech'; b.setAttribute('role', 'status'); el.prepend(b); }
    b.textContent = s.text;
    const mesa = el.closest('.mesa');
    // na metade de cima da mesa o balão vai para baixo, para não sair da mesa
    const below = mesa && (el.offsetTop + el.offsetHeight / 2) < mesa.clientHeight * 0.45;
    b.classList.toggle('below', !!below);
    const cx = mesa ? (el.offsetLeft + el.offsetWidth / 2) / mesa.clientWidth : 0.5;
    b.classList.toggle('al', cx < 0.3);   // jogador da esquerda: balão cresce para a direita
    b.classList.toggle('ar', cx > 0.7);   // jogador da direita: balão cresce para a esquerda
  });
}
function chatBubble(text) {
  let el = document.getElementById('chatBubble');
  if (!el) { el = document.createElement('div'); el.id = 'chatBubble'; document.body.appendChild(el); el.onclick = () => openChatSheet(true); }
  el.textContent = text; el.hidden = false;
  clearTimeout(chatBubble.t); chatBubble.t = setTimeout(() => (el.hidden = true), 4000);
}

const canChat = () => !!(cur && !solo && account && db && mySeat() >= 0 && cur.phase !== 'lobby' && cur.phase !== 'gameEnd');

function chatPanelHtml() {
  if (solo) return '';
  const ended = cur && cur.phase === 'gameEnd';
  return `<section class="panel chat-panel" aria-label="Conversa da mesa">
    <div class="chat-head"><h3>Conversa da mesa</h3><button type="button" class="small chat-close" data-chatclose aria-label="Fechar conversa">Fechar</button></div>
    <div class="chat-list" id="chatList" aria-live="polite"></div>
    ${ended ? '<p class="muted chat-note">A conversa foi apagada no fim da partida.</p>' : `
    <form class="chat-form" id="chatForm" autocomplete="off">
      <input id="chatInput" maxlength="${CHAT_MAX_TEXT}" placeholder="${canChat() ? 'Escreva para a mesa…' : 'Só quem está jogando pode falar'}" ${canChat() ? '' : 'disabled'} aria-label="Mensagem">
      <button type="submit" class="small primary" ${canChat() ? '' : 'disabled'}>Enviar</button>
    </form>
    <p class="muted chat-note" id="voiceStatus">${esc(voiceStatusText())}</p>`}
  </section>`;
}
// botões da linha de cima: 💬 (celular) e 🎤 segurar para falar
const chatToggleHtml = () => (solo ? '' : `${voiceOK() && canChat() ? '<button type="button" class="small ptt" data-ptt aria-label="Segure para falar com a mesa">🎤 Falar</button>' : ''}<button type="button" class="small chat-toggle" data-chatopen aria-label="Abrir conversa">💬${chatUnread ? `<span class="badge">${chatUnread}</span>` : ''}</button>`);

function renderChat() {
  const list = document.getElementById('chatList');
  document.querySelectorAll('[data-chatopen]').forEach(b => (b.innerHTML = '💬' + (chatUnread ? `<span class="badge">${chatUnread}</span>` : '')));
  const vs = document.getElementById('voiceStatus'); if (vs) vs.textContent = voiceStatusText();
  if (!list) return;
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  list.innerHTML = chatMsgs.length ? chatMsgs.map(m => `
    <div class="chat-msg ${m.from === myId ? 'mine' : ''}">
      <span class="who">${esc(m.from === myId ? 'Você' : (m.name || 'Alguém'))}</span>
      <span class="txt">${esc(m.text)}</span>
    </div>`).join('') : '<p class="muted chat-empty">Ninguém escreveu nada ainda.</p>';
  if (atBottom || list.dataset.first !== '1') { list.scrollTop = list.scrollHeight; list.dataset.first = '1'; }
}

// guarda o que está sendo digitado, porque a mesa é redesenhada a cada jogada
let chatDraft = '', chatHadFocus = false;
function saveChatDraft() {
  const i = document.getElementById('chatInput');
  if (i) { chatDraft = i.value; chatHadFocus = document.activeElement === i; }
}
function bindChat() {
  if (typeof placeMusic === 'function') placeMusic();
  const f = document.getElementById('chatForm'), i = document.getElementById('chatInput');
  if (i) { i.value = chatDraft; if (chatHadFocus && !i.disabled) i.focus(); i.oninput = () => (chatDraft = i.value); }
  if (f) f.onsubmit = e => { e.preventDefault(); sendChatText(); };
  document.querySelectorAll('[data-ptt]').forEach(b => {
    b.onpointerdown = e => { e.preventDefault(); pttPress(); };
    b.oncontextmenu = e => e.preventDefault();
    b.classList.toggle('on', pttDown);
  });
  document.querySelectorAll('[data-chatopen]').forEach(b => (b.onclick = () => openChatSheet(true)));
  document.querySelectorAll('[data-chatclose]').forEach(b => (b.onclick = () => openChatSheet(false)));
  document.body.classList.toggle('chat-open', chatSheetOpen);
  renderChat();
  applyTalking();
  applySpeech();
}
function openChatSheet(open) {
  chatSheetOpen = open;
  if (open) chatUnread = 0;
  document.body.classList.toggle('chat-open', open);
  renderChat();
  if (open) { const i = document.getElementById('chatInput'); if (i && !i.disabled) setTimeout(() => i.focus(), 50); }
}

const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
async function sendChatText() {
  const i = document.getElementById('chatInput');
  const text = (i ? i.value : '').trim().slice(0, CHAT_MAX_TEXT);
  if (!text) return;
  if (!canChat()) return toast('A conversa só funciona durante a partida.');
  if (Date.now() - lastChatSend < 700) return toast('Calma, uma mensagem por vez.');
  lastChatSend = Date.now();
  chatDraft = ''; if (i) i.value = '';
  try { await db.collection('chat').doc(chatCode + '-' + rid()).set({ table: chatCode, from: myId, name: myNick, at: Date.now(), text }); }
  catch { toast('Não deu para enviar. Tente de novo.'); }
}

/* ---------------- VOZ AO VIVO ----------------
   Cada par de jogadores abre uma ligação direta. Quem tem o nome "menor" chama,
   o outro atende. O microfone só manda som enquanto o botão está apertado. */
const STUN = { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] };
// TURN = servidor de retransmissão. Sem ele, dois celulares no 4G/5G quase nunca se acham.
// Configure em voz-config.js (window.TURN_CREDENTIALS_URL ou window.TURN_SERVERS).
let iceCache = null;
async function getIceServers() {
  if (iceCache && Date.now() - iceCache.at < 6 * 3600e3) return iceCache.list;
  let extra = Array.isArray(window.TURN_SERVERS) ? window.TURN_SERVERS.slice() : [];
  if (window.TURN_CREDENTIALS_URL) {
    try {
      const r = await fetch(window.TURN_CREDENTIALS_URL);
      const j = await r.json();
      extra = extra.concat(Array.isArray(j) ? j : (j.iceServers || []));
    } catch {}
  }
  const list = [STUN, ...extra];
  iceCache = { at: Date.now(), list, hasTurn: extra.some(s => [].concat(s.urls || s.url || []).some(u => /^turns?:/.test(u))) };
  return list;
}
const hasTurn = () => !!(iceCache && iceCache.hasTurn);
const voiceOK = () => !!(window.RTCPeerConnection && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && (localMode || !window.claude);
let vz = null;          // { code, session, peers: {key: {pc, offerId, remoteSession, audio, answered}}, talking: {}, unsub }
let micStream = null, micTrack = null, pttDown = false, pttPressedAt = 0, micReleasedAt = 0;

const vozId = (...parts) => [vz.code, ...parts].join('-');
function writeVoz(id, body) { return db.collection('voz').doc(id).set({ table: vz.code, from: myId, at: Date.now(), ...body }).catch(() => {}); }

function startVoice(c) {
  stopVoice();
  if (!voiceOK() || solo || !db || !account || mySeat() < 0) return;
  const v = vz = { code: c, session: rid(), peers: {}, talking: {}, ice: [STUN] };
  getIceServers().then(list => {
    if (vz !== v) return;
    v.ice = list;
    writeVoz(vozId(myId), { kind: 'hello', session: v.session, talking: false });
    v.unsub = db.collection('voz').where('table', '==', c).onSnapshot(snap => onVozDocs(snap.docs.map(d => ({ id: d.id, ...d.data() }))), () => {});
  });
}
function stopVoice() {
  pttRelease();
  if (!vz) return;
  const v = vz; vz = null;
  if (v.unsub) v.unsub();
  for (const k in v.peers) closePeer(v.peers[k]);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = micTrack = null;
  // apaga o que esta pessoa deixou no banco para a ligação
  db.collection('voz').where('table', '==', v.code).get().then(s => s.docs.forEach(d => { if (d.data().from === myId) db.collection('voz').doc(d.id).delete().catch(() => {}); })).catch(() => {});
}
function closePeer(p) {
  p.closed = true; clearTimeout(p.retryT);
  try { p.pc.close(); } catch {}
  if (p.audio) p.audio.remove();
}

function onVozDocs(docs) {
  if (!vz || !cur) return;
  const others = cur.seats.filter(k => k && k !== myId);
  for (const d of docs) {
    if (!others.includes(d.from)) continue;
    if (d.kind === 'hello') {
      vz.talking[d.from] = !!d.talking;
      const p = vz.peers[d.from];
      if (myId < d.from && (!p || p.remoteSession !== d.session)) makeOffer(d.from, d.session);
    } else if (d.kind === 'offer' && d.to === myId && d.from < myId) {
      const p = vz.peers[d.from];
      if (!p || p.offerId !== d.offerId) answerOffer(d);
    } else if (d.kind === 'answer' && d.to === myId) {
      const p = vz.peers[d.from];
      if (p && p.offerId === d.offerId && !p.answered) {
        p.answered = true;
        p.pc.setRemoteDescription({ type: 'answer', sdp: d.sdp }).catch(() => {});
      }
    }
  }
  applyTalking();
  renderChat();
}

function newPeer(key) {
  const pc = new RTCPeerConnection({ iceServers: vz.ice });
  const p = { pc, key, state: 'conectando', tries: 0 };
  pc.ontrack = e => {
    if (!p.audio) { p.audio = document.createElement('audio'); p.audio.autoplay = true; p.audio.playsInline = true; p.audio.setAttribute('playsinline', ''); document.body.appendChild(p.audio); }
    p.audio.srcObject = e.streams[0] || new MediaStream([e.track]);
    p.audio.play().catch(() => {});
  };
  pc.onconnectionstatechange = () => {
    p.state = { connected: 'conectado', failed: 'falhou', disconnected: 'caiu', closed: 'fechado' }[pc.connectionState] || 'conectando';
    if (p.state === 'conectado') p.tries = 0;
    clearTimeout(p.retryT);
    // quem chama tenta de novo (até 3 vezes); "caiu" espera 5s porque às vezes volta sozinho
    if ((p.state === 'falhou' || p.state === 'caiu') && myId < key && p.tries < 3) {
      p.retryT = setTimeout(() => {
        if (p.closed || !vz || vz.peers[key] !== p || p.state === 'conectado') return;
        makeOffer(key, p.remoteSession, p.tries + 1);
      }, p.state === 'caiu' ? 5000 : 1500);
    }
    renderChat();
  };
  return p;
}
const waitIce = pc => new Promise(res => {
  if (pc.iceGatheringState === 'complete') return res();
  const t = setTimeout(res, 4000);
  pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
});
async function makeOffer(to, remoteSession, tries = 0) {
  if (vz.peers[to]) closePeer(vz.peers[to]);
  const p = newPeer(to);
  p.offerId = rid(); p.remoteSession = remoteSession; p.tries = tries;
  vz.peers[to] = p;
  const tr = p.pc.addTransceiver('audio', { direction: 'sendrecv' });
  if (micTrack) tr.sender.replaceTrack(micTrack);
  try {
    await p.pc.setLocalDescription(await p.pc.createOffer());
    await waitIce(p.pc);
    if (vz && vz.peers[to] === p) writeVoz(vozId(myId, to, 'o'), { kind: 'offer', to, offerId: p.offerId, sdp: p.pc.localDescription.sdp });
  } catch { p.state = 'falhou'; }
}
async function answerOffer(d) {
  if (vz.peers[d.from]) closePeer(vz.peers[d.from]);
  const p = newPeer(d.from);
  p.offerId = d.offerId;
  vz.peers[d.from] = p;
  try {
    await p.pc.setRemoteDescription({ type: 'offer', sdp: d.sdp });
    const tr = p.pc.getTransceivers()[0];
    if (tr) { tr.direction = 'sendrecv'; if (micTrack) await tr.sender.replaceTrack(micTrack); }
    await p.pc.setLocalDescription(await p.pc.createAnswer());
    await waitIce(p.pc);
    if (vz && vz.peers[d.from] === p) writeVoz(vozId(myId, d.from, 'a'), { kind: 'answer', to: d.from, offerId: d.offerId, sdp: p.pc.localDescription.sdp });
  } catch { p.state = 'falhou'; }
}

// segurar para falar
async function ensureMic() {
  if (micTrack) return true;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch { toast('Libere o microfone para falar (nas permissões do navegador).'); return false; }
  micTrack = micStream.getAudioTracks()[0];
  micTrack.enabled = false;
  if (vz) for (const k in vz.peers) vz.peers[k].audio?.play().catch(() => {});
  if (vz) for (const k in vz.peers) { const tr = vz.peers[k].pc.getTransceivers()[0]; if (tr) tr.sender.replaceTrack(micTrack).catch(() => {}); }
  return true;
}
async function pttPress() {
  if (pttDown || !vz || !canChat()) return;
  pttDown = true; pttPressedAt = Date.now();
  window.addEventListener('pointerup', pttRelease, { once: true });
  window.addEventListener('pointercancel', pttRelease, { once: true });
  document.querySelectorAll('[data-ptt]').forEach(b => b.classList.add('on'));
  const firstTime = !micTrack;
  if (!(await ensureMic())) return pttRelease();
  if (micReleasedAt > pttPressedAt) { if (firstTime) toast('Microfone liberado. Agora segure 🎤 para falar.'); return; } // soltou enquanto pedia permissão
  micTrack.enabled = true;
  writeVoz(vozId(myId), { kind: 'hello', session: vz.session, talking: true });
}
function pttRelease() {
  micReleasedAt = Date.now();
  if (!pttDown) return;
  pttDown = false;
  if (micTrack) micTrack.enabled = false;
  document.querySelectorAll('[data-ptt]').forEach(b => b.classList.remove('on'));
  if (vz) writeVoz(vozId(myId), { kind: 'hello', session: vz.session, talking: false });
}

// o iPhone só toca o som da ligação depois de um toque na tela
document.addEventListener('pointerdown', () => { if (vz) for (const k in vz.peers) vz.peers[k].audio?.play().catch(() => {}); });

function voiceStatusText() {
  if (!voiceOK()) return 'Voz ao vivo só no site do jogo. Tudo some quando a partida acaba.';
  if (!vz) return 'Tudo some quando a partida acaba.';
  const ps = Object.values(vz.peers);
  if (!ps.length) return 'Voz: esperando os outros jogadores… Segure 🎤 Falar para falar.';
  const name = k => (cur && cur.names[k]) || k;
  const bad = ps.filter(p => p.state === 'falhou' || p.state === 'caiu');
  const ok = ps.filter(p => p.state === 'conectado');
  let t = ok.length ? `Voz conectada com ${ok.map(p => name(p.key)).join(', ')}.` : 'Voz: conectando…';
  if (bad.length) t += ` Não conectou com ${bad.map(p => name(p.key)).join(', ')}` + (hasTurn() ? ' (tentando de novo…).' : ' (no 4G/5G precisa do servidor de retransmissão; no mesmo Wi-Fi costuma funcionar).');
  return t + ' Segure 🎤 Falar para falar.';
}
// quem está falando ganha destaque na mesa
function applyTalking() {
  document.querySelectorAll('.seat[data-key]').forEach(el => {
    const k = el.dataset.key;
    el.classList.toggle('talking', k === myId ? pttDown : !!(vz && vz.talking[k]));
  });
}

/* ---------------- SOM DE VIOLA DE FUNDO ----------------
   Um trecho de viola em loop (arquivo viola.mp3, ao lado do site).
   Tocar no 🎵 abre o painel: liga/desliga e volume. Cada pessoa escolhe no
   próprio aparelho e o jogo lembra. O volume passa pelo controle de áudio
   porque o iPhone ignora o volume normal da página. */
const MUSIC_SRC = 'viola.mp3';
const MUSIC_MAX = 0.2;     // volume no 100%
const MUSIC_DEFAULT = 30;  // começa em 30%
const music = { box: null, ctx: null, gain: null, el: null, on: true, vol: MUSIC_DEFAULT };
try {
  music.on = localStorage.getItem('truco.musica') !== 'off';
  const v = parseInt(localStorage.getItem('truco.volume'), 10);
  if (v >= 0 && v <= 100) music.vol = v;
} catch {}
// a curva é quadrática: o começo da barra fica mais fino, que é onde o ouvido nota diferença
const musicLevel = () => MUSIC_MAX * (music.vol / 100) ** 2;
function initMusic() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || (window.claude && !localMode)) return;
  const box = music.box = document.createElement('div'); box.className = 'music';
  box.innerHTML = `<button type="button" class="tog" aria-label="Som" aria-expanded="false" aria-controls="volPanel">🎵</button>
    <div class="vol" id="volPanel" hidden>
      <h4>Som de viola</h4>
      <div class="vrow"><button type="button" class="onoff"></button></div>
      <div class="vrow"><span aria-hidden="true">🔈</span><input type="range" min="0" max="100" step="5" aria-label="Volume da viola"><span class="pct"></span></div>
      <h4>Som das cartas</h4>
      <div class="vrow"><button type="button" class="onoff sfx"></button></div>
    </div>`;
  document.body.appendChild(box);
  const pop = box.querySelector('.vol'), tog = box.querySelector('.tog'), range = box.querySelector('input');
  const openPop = open => { pop.hidden = !open; tog.setAttribute('aria-expanded', String(open)); };
  tog.onclick = e => { e.stopPropagation(); openPop(pop.hidden); };
  box.querySelector('.onoff:not(.sfx)').onclick = e => { e.stopPropagation(); setMusic(!music.on); };
  box.querySelector('.onoff.sfx').onclick = e => { e.stopPropagation(); setSfx(!sfx.on); };
  range.value = music.vol;
  range.oninput = () => {
    music.vol = +range.value;
    try { localStorage.setItem('truco.volume', String(music.vol)); } catch {}
    if (music.vol > 0 && !music.on) setMusic(true);
    applyMusicVolume(); paintMusic();
  };
  pop.onpointerdown = e => e.stopPropagation();
  // tocar fora fecha o painel
  document.addEventListener('pointerdown', e => { if (!box.contains(e.target)) openPop(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') openPop(false); });
  paintMusic();
  // o navegador só deixa tocar som depois do primeiro toque na tela
  const kick = () => { if (music.on) playMusic(); };
  document.addEventListener('pointerdown', kick, { once: true, capture: true });
  document.addEventListener('keydown', kick, { once: true, capture: true });
  setInterval(() => { applyMusicVolume(); placeMusic(); }, 400);
}
function setMusic(on) {
  music.on = on;
  try { localStorage.setItem('truco.musica', on ? 'on' : 'off'); } catch {}
  if (on) playMusic(); else if (music.el) music.el.pause();
  paintMusic();
}
function paintMusic() {
  const box = music.box; if (!box) return;
  const tog = box.querySelector('.tog'), oo = box.querySelector('.onoff:not(.sfx)'), fx = box.querySelector('.onoff.sfx');
  fx.textContent = sfx.on ? 'Ligado' : 'Desligado';
  fx.classList.toggle('on', sfx.on);
  fx.setAttribute('aria-pressed', String(sfx.on));
  tog.classList.toggle('off', !music.on || !music.vol);
  tog.title = 'Som de viola: ' + (music.on ? music.vol + '%' : 'desligado');
  oo.textContent = music.on ? 'Ligado' : 'Desligado';
  oo.classList.toggle('on', music.on);
  oo.setAttribute('aria-pressed', String(music.on));
  box.querySelector('.pct').textContent = music.vol + '%';
}
function playMusic() {
  if (!music.el) {
    const el = music.el = new Audio(MUSIC_SRC);
    el.loop = true; el.preload = 'auto'; el.setAttribute('playsinline', '');
    el.onerror = () => { if (music.box) music.box.hidden = true; }; // sem o arquivo, some o botão
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      music.ctx = new AC();
      music.gain = music.ctx.createGain(); music.gain.gain.value = musicLevel();
      music.ctx.createMediaElementSource(el).connect(music.gain).connect(music.ctx.destination);
    } catch { music.ctx = music.gain = null; el.volume = Math.min(1, musicLevel()); }
  }
  if (music.ctx && music.ctx.state === 'suspended') music.ctx.resume().catch(() => {});
  music.el.play().catch(() => {});
}
// enquanto alguém fala na voz, a viola cai para um terço
function applyMusicVolume() {
  if (!music.el) return;
  const talking = pttDown || !!(vz && Object.values(vz.talking).some(Boolean));
  const v = musicLevel() * (talking ? 0.3 : 1);
  if (music.gain) music.gain.gain.setTargetAtTime(v, music.ctx.currentTime, 0.08); else music.el.volume = Math.min(1, v);
}
// na partida vai para a barra da mesa (logo depois do nome da mesa); fora dela, canto da tela
function placeMusic() {
  const box = music.box; if (!box) return;
  const bar = document.body.classList.contains('in-game') && document.querySelector('.board > .tablebar');

/* =========================================================
   TORNEIOS EM DUPLAS
   - Organização: o primeiro a "assumir" vira dono; o dono escolhe os organizadores.
   - Organizador cria o torneio (vagas até 32 duplas, valor por jogador, Pix, prêmio).
   - Um jogador inscreve a dupla e convida o parceiro; cada um envia o comprovante.
   - A organização confere o comprovante e aprova. Dupla confirmada = convite aceito + 2 pagamentos aprovados.
   - Ao fechar as inscrições: sorteio, chave eliminatória, cada confronto em melhor de 3.

// lê-modifica-grava de uma vez só (no Firebase é transação; no teste local é get+set)
async function transact(path, fn) {
  const ref = db.doc(path);
  if (ref.transact) return ref.transact(fn);
  const s = await ref.get();
  const next = fn(s.exists ? structuredClone(s.data()) : null);
  if (next) await ref.set(next);
  return next;
}

// ---- comprovante: guarda a imagem até a organização validar ----
function shrinkReceipt(file, maxBytes = 230 * 1024) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('tipo'));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      let side = 1400, q = 0.72, out = '';
      for (let k = 0; k < 8; k++) {
        const s = Math.min(1, side / Math.max(im.naturalWidth, im.naturalHeight));
        const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length * 0.75 <= maxBytes) break;
        side *= 0.82; q = Math.max(0.45, q - 0.06);
      }
      URL.revokeObjectURL(url); resolve(out);
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('leitura')); };
    im.src = url;
  });
}
async function sendReceipt(tid, file) {
  const ins = tour.insc.find(i => i.status !== 'recusado' && (i.p1 === myId || i.p2 === myId));
  if (!ins) return toast('Você não está inscrito.');
  try {
    const img = await shrinkReceipt(file);
    await db.doc('comprovantes/' + tid + '-' + myId).set({ torneio: tid, from: myId, name: myNick, insc: ins.id, img, status: 'pendente', at: Date.now() });
    await transact('inscricoes/' + ins.id, i => (i ? { ...i, pay: { ...(i.pay || {}), [myId]: 'pendente' }, updatedAt: Date.now() } : null));
    tour.myComp = { status: 'pendente' };
    toast('Comprovante enviado. Aguarde a organização conferir.');
    renderTournament();
  } catch (e) { toast(e && e.message === 'tipo' ? 'Escolha uma imagem (print ou foto do comprovante).' : 'Não deu para enviar o comprovante.'); }
}

    await transact('inscricoes/' + c.insc, i => (i ? { ...i, pay: { ...(i.pay || {}), [c.from]: ok ? 'aprovado' : 'recusado' }, updatedAt: Date.now() } : null));

}

// ---- sorteio e chave ----
function drawBracket(confirmed, pot) {
  const ids = confirmed.map(i => i.id);
  for (let k = ids.length - 1; k > 0; k--) { const j = randInt(k + 1); [ids[k], ids[j]] = [ids[j], ids[k]]; } // sorteio
  let size = 2; while (size < ids.length) size *= 2;
  // folgas (BYE) espalhadas: cada folga enfrenta uma dupla, nunca outra folga
  const slots = [];
  const byes = size - ids.length;
  let b = 0;
  for (let m = 0; m < size / 2; m++) { slots.push(ids.shift()); slots.push(b < byes ? (b++, 'BYE') : ids.shift()); }
  const rounds = [];
  rounds.push(Array.from({ length: size / 2 }, (_, i) => newMatch(slots[2 * i], slots[2 * i + 1])));
  for (let n = size / 4; n >= 1; n /= 2) rounds.push(Array.from({ length: n }, () => newMatch(null, null)));
  const chave = { rounds, pot, createdAt: Date.now(), updatedAt: Date.now() };
  // folgas passam direto
  rounds[0].forEach((m, i) => { if (m.b === 'BYE') { m.winner = m.a; m.w = [2, 0]; advance(chave, 0, i); } });
  db.doc('chaves/' + tour.id).set(chave)
    .then(() => db.doc('torneios/' + tour.id).update({ status: 'andamento', updatedAt: Date.now() }))
    .then(() => toast('Sorteio feito! A chave está pronta.'), () => toast('Não deu para sortear.'));
}
function newMatch(a, b) { return { a, b, w: [0, 0], g: 0, winner: null, mesa: null }; }
function advance(chave, r, i) {
  const m = chave.rounds[r][i];
  if (r === chave.rounds.length - 1) { chave.campeao = m.winner; chave.vice = m.winner === m.a ? m.b : m.a; return; }
  const next = chave.rounds[r + 1][Math.floor(i / 2)];
  if (i % 2 === 0) next.a = m.winner; else next.b = m.winner;
}

// abre (ou reabre) a mesa do jogo atual do confronto
let tourReturn = null;
async function playMatch(r, i) {
  const tid = tour.id;
  const byId = Object.fromEntries(tour.insc.map(x => [x.id, x]));
  let codeToOpen = null;
  try {
    await transact('chaves/' + tid, ch => {
      const m = ch && ch.rounds[r][i];
      if (!m || m.winner) return null;
      if (m.mesa) { codeToOpen = m.mesa; return null; }
      codeToOpen = genCode(); m.mesa = codeToOpen; ch.updatedAt = Date.now();
      return ch;
    });
    const ch = tour.chave, m = ch && ch.rounds[r][i];
    const existing = await tableRef(codeToOpen).get().catch(() => null);
    if (!existing || !existing.exists) {
      const A = byId[m.a], B = byId[m.b];
      const seats = [A.p1, B.p1, A.p2, B.p2]; // time 1 = dupla de cima, time 2 = dupla de baixo
      const names = { ...A.names, ...B.names };
      await tableRef(codeToOpen).set({
        v: 1, code: codeToOpen, n: 4, stake: 0, owner: myId, createdAt: Date.now(), updatedAt: Date.now(),
        seats, names, phase: 'lobby', score: [0, 0], dealer: 0, hand: null, result: null, games: [], balances: {}, gameNo: (m.g || 0), log: [],
        torneio: { tid, r, i, g: m.g || 0, nome: tour.t.nome },
      });
    }
    closeTournament(); tourReturn = tid; openTable(codeToOpen);
  } catch { toast('Não deu para abrir a mesa.'); }
}

// fim de um jogo do torneio: soma a vitória na chave (melhor de 3)
async function advanceBracket(st) {
  const T = st.torneio, g = st.games[0];
  if (!T || !g) return;
  try {
    await transact('chaves/' + T.tid, ch => {
      const m = ch && ch.rounds[T.r] && ch.rounds[T.r][T.i];
      if (!m || m.winner || (m.g || 0) !== T.g) return null; // já contado
      m.w[g.winner === 0 ? 0 : 1]++;
      m.g = (m.g || 0) + 1; m.mesa = null;
      if (m.w[0] >= 2 || m.w[1] >= 2) { m.winner = m.w[0] >= 2 ? m.a : m.b; advance(ch, T.r, T.i); }
      ch.updatedAt = Date.now();
      return ch;
    });
  } catch {}
}

function genCode() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[randInt(A.length)]; return s; }

let lastTableKey = '';
function openTable(c) {
  if (!db) return;
  stopTourneyLobby();
  closeTournament();
  if (unsubList) { unsubList(); unsubList = null; }
  if (unsubRank) { unsubRank(); unsubRank = null; }
  if (unsubTable) unsubTable();
  stopTableTimers();
  code = c; cur = null; cover = false;
  let first = true; lastTableKey = '';
  history.replaceState(null, '', '#' + c);
  $app.innerHTML = '<p class="muted">Procurando a mesa…</p>';
  document.getElementById('topRight').innerHTML = '';
  unsubTable = tableRef(c).onSnapshot(snap => {
    if (!snap.exists && cur && cur.code === c && cur.phase === 'gameEnd') return; // mesa apagada depois do fim: mantém o resultado na tela
    if (!snap.exists) { $app.innerHTML = `<div class="panel"><p>Mesa <span class="code">${esc(c)}</span> não encontrada.</p><div class="row"><button id="back">Voltar</button></div></div>`; document.getElementById('back').onclick = showLobby; return; }
    const data = snap.data();
    if (first) {
      first = false;
      if (!data.closedAt && isEmptyTable(data)) {
        removeTable(c);
        $app.innerHTML = `<div class="panel"><p>A mesa <span class="code">${esc(c)}</span> foi fechada porque ficou vazia.</p><div class="row"><button id="back">Voltar ao saguão</button></div></div>`;
        document.getElementById('back').onclick = showLobby;
        unsubTable(); unsubTable = null;
        return;
      }
      cur = data;
      startTableTimers(c);
      startChat(c);
    }
    // o "estou aqui" (aliveAt) de cada jogador chega a cada poucos segundos:
    // se só isso mudou, não precisa redesenhar a mesa inteira
    const key = JSON.stringify({ ...data, aliveAt: 0 });
    cur = data;
    if (key === lastTableKey) return;
    lastTableKey = key;
    if (data.phase === 'gameEnd') clearChat(c); // fim da partida: a conversa some
    render();
  }, () => toast('A conexão com a mesa caiu. Recarregue a página.'));
}

/* =========================================================
   MESA VAZIA (30 s) E TEMPO POR JOGADA (20 s)
   ========================================================= */
const EMPTY_AFTER_MS = 30 * 1000;   // mesa sem ninguém com ela aberta
const TURN_MS = 20 * 1000;          // tempo de cada jogada
const DEAL_MS = 5 * 1000;           // depois de cada mão, as cartas saem sozinhas
const limitFor = st => (st.phase === 'handEnd' ? DEAL_MS : TURN_MS);
const GRACE_MS = 2000;              // os outros esperam um pouco antes de agir pelo jogador
const HEARTBEAT_MS = 10 * 1000;
let heartbeatTimer = null, clockTimer = null;

// Quem está com a mesa aberta avisa que está ali a cada 10 s (aliveAt).
const isEmptyTable = t => Date.now() - (t.aliveAt || t.updatedAt || 0) > EMPTY_AFTER_MS;

function startTableTimers(c) {
  stopTableTimers();
  const beat = () => { if (canWrite && code === c && cur && !cur.closedAt) tableRef(c).update({ aliveAt: Date.now() }).catch(() => {}); };
  beat();
  heartbeatTimer = setInterval(beat, HEARTBEAT_MS);
  clockTimer = setInterval(tickClock, 1000);
}
function stopTableTimers() { clearInterval(heartbeatTimer); clearInterval(clockTimer); heartbeatTimer = clockTimer = null; }

// Quem precisa agir agora, ou -1. Na hora de dar as cartas é o próximo a dar.
function currentActor(st) {
  const h = st.hand;
  if (!h) return -1;
  if (st.phase === 'play') return h.turn;
  if (st.phase === 'truco') return h.pending.responder;
  if (st.phase === 'onze') return h.onzeDecider;
  if (st.phase === 'handEnd') return (st.dealer + 1) % st.n;
  return -1;
}
function timeLeft(st) { return st.turnAt ? Math.max(0, Math.ceil((st.turnAt + limitFor(st) - Date.now()) / 1000)) : null; }

function tickClock() {
  if (!cur || solo) return;
  const el = document.getElementById('clock');
  const left = timeLeft(cur);
  if (el && left !== null) { el.textContent = left + 's'; el.classList.toggle('low', left <= 5); }
  const actor = currentActor(cur);
  if (actor < 0 || !cur.turnAt || busy) return;
  const late = Date.now() - cur.turnAt - limitFor(cur);
  const mine = cur.seats[actor] === myId;
  if (late >= (mine ? 0 : GRACE_MS) && (mine || mySeat() >= 0)) autoMove(cur.turnAt);
}

// Jogada automática quando o tempo acaba. É determinística, então se dois jogadores
// agirem ao mesmo tempo o resultado é o mesmo.
function autoMove(expectedTurnAt) {
  commit(st => {
    if (st.turnAt !== expectedTurnAt) return false;
    const h = st.hand, actor = currentActor(st);
    if (actor < 0) return false;
    if (st.phase === 'play') {
      const cards = h.hands[actor];
      let low = 0;
      cards.forEach((c, i) => { if (strength(c, h.vira) < strength(cards[low], h.vira)) low = i; });
      addLog(st, `Tempo esgotado: ${nick(st, actor)} jogou a menor carta.`);
      playCard(st, actor, low, false);
    } else if (st.phase === 'truco') {
      addLog(st, `Tempo esgotado: ${nick(st, actor)} não respondeu e correu.`);
      endHand(st, h.pending.by, h.value, 'tempo esgotado: o outro time correu');
    } else if (st.phase === 'onze') {
      addLog(st, `Tempo esgotado na mão de onze: ${teamLabel(team(actor))} correu.`);
      endHand(st, 1 - team(actor), 1, 'tempo esgotado na mão de onze');
    } else if (st.phase === 'handEnd') {
      st.dealer = actor;
      deal(st);
    } else return false;
  });
}

const mySeat = () => (cur ? cur.seats.indexOf(myId) : -1);

async function sit(i) {
  if (!account) return toast('Entre com seu usuário e senha no saguão para sentar.');
  try {
    const lock = await db.doc('mesas/' + code + '/locks/seats').acquire({ holder: myId, ttlMs: 4000 });
    if (!lock.acquired) return toast('Alguém está sentando agora. Tente de novo em um segundo.');
    const s = await tableRef(code).get();
    cur = s.data();
  } catch {}
  commit(st => {
    if (st.phase !== 'lobby' || st.seats[i]) { toast('Essa cadeira já está ocupada.'); return false; }
    const old = st.seats.indexOf(myId);
    if (old >= 0) st.seats[old] = null;
    st.seats[i] = myId; st.names[myId] = myNick;
    if (old < 0) addLog(st, `${myNick} sentou na mesa.`);
  });
}

function render() {
  if (!cur) return;
  const st = cur, me = mySeat(), seated = me >= 0;
  const view = seated ? me : 0;
  const myTeam = team(view);
  if (st.phase === 'lobby') {
    document.body.classList.remove('in-game');
    document.getElementById('topRight').innerHTML = `<span class="muted">Mesa</span> <span class="code">${esc(st.code)}</span> <button class="small" id="copy">Copiar código</button> <button class="small" id="leave">Saguão</button>`;
    document.getElementById('copy').onclick = () => navigator.clipboard?.writeText(st.code).then(() => toast('Código copiado.'), () => toast('Código: ' + st.code));
    document.getElementById('leave').onclick = showLobby;
    return renderSeating(st, me);
  }
  // durante o jogo a tela é só a mesa: sem cabeçalho, Mesa e Saguão vão para o lado
  document.body.classList.add('in-game');

  const tableBar = `<div class="tablebar">${solo ? '<span class="tag">Treino</span>' : `<span class="muted">Mesa</span> <span class="code">${esc(st.code)}</span> <span class="tag stake">vale $ ${esc(st.stake)}</span>`}${chatToggleHtml()}<button class="small" data-leave>Saguão</button></div>`;

  const h = st.hand;
  const r = h.rw.length;
  const usLabel = seated ? 'Nós' : teamLabel(0), themLabel = seated ? 'Eles' : teamLabel(1);
  const us = myTeam, them = 1 - myTeam;
  const pip = t => (t === undefined ? '' : t === -1 ? 'tie' : t === us ? 'us' : 'them');
  const pips = [0, 1, 2].map(i => `<span class="pip ${pip(h.rw[i])}" title="Vaza ${i + 1}"></span>`).join('');

  // posições na mesa: eu embaixo, sentido anti-horário
  const pos = (seat, rad) => {
    const k = (seat - view + st.n) % st.n;
    const ang = (90 - (k * 360) / st.n) * Math.PI / 180;
    return { x: 50 + rad[0] * Math.cos(ang), y: 50 + rad[1] * Math.sin(ang) };
  };
  const showPartner = h.onzeTeam >= 0 && seated && team(me) === h.onzeTeam && st.n > 2 && st.phase !== 'gameEnd';
  const actor = st.phase === 'truco' ? h.pending.responder : st.phase === 'onze' ? h.onzeDecider : st.phase === 'play' ? h.turn : -1;

  let seatsHtml = '';
  for (let s = 0; s < st.n; s++) {
    if (seated && s === me) continue;
    const p = pos(s, [35, 37]);
    const cls = team(s) === us ? 'us' : 'them';
    const left = h.hands[s].length;
    const backs = Array.from({ length: left }, () => '<span class="card back"></span>').join('');
    const role = [s === st.dealer ? 'deu as cartas' : '', s === h.mao ? 'mão' : ''].filter(Boolean).join(' · ');
    seatsHtml += `<div class="seat ${cls} ${s === actor ? 'turn' : ''}" data-key="${esc(st.seats[s] || '')}" style="left:${p.x}%;top:${p.y}%">${avatarHtml(st.seats[s], nick(st, s))}<span class="name">${esc(nick(st, s))}</span><span class="mini">${backs}</span>${role ? `<span class="role">${role}</span>` : ''}</div>`;
  }
  // cartas jogadas: rodada atual, ou a última encerrada
  let showRound = h.played[r] && h.played[r].length ? r : r - 1;
  if (showRound < 0) showRound = 0;
  const plays = h.played[showRound] || [];
  const old = showRound !== r || st.phase === 'handEnd' || st.phase === 'gameEnd';
  let winSeat = -1;
  if (h.rw[showRound] !== undefined && h.rw[showRound] >= 0) {
    const str = p => (p.covered ? -1 : strength(p.card, h.vira));
    const best = Math.max(...plays.map(str));
    const tops = plays.filter(p => str(p) === best && team(p.seat) === h.rw[showRound] && !p.covered);
    winSeat = (tops.length ? tops.reduce((x, y) => (SUITS.indexOf(y.card[1]) > SUITS.indexOf(x.card[1]) ? y : x)) : plays.find(p => str(p) === best)).seat;
  }
  const hk = handKey(st);
  const playedHtml = plays.map(p => {
    const q = pos(p.seat, st.n === 6 ? [22, 24] : [20, 15]);
    // de onde a carta sai: da cadeira de quem jogou (a minha vem de baixo, da mão)
    const f = seated && p.seat === me ? { x: 50, y: 118 } : pos(p.seat, [35, 37]);
    return `<div class="played ${p.seat === winSeat ? 'win' : ''} ${old && st.phase === 'play' ? 'old' : ''}" data-ak="${hk}|${showRound}|${p.seat}" data-from="${f.x - q.x},${f.y - q.y}" style="left:${q.x}%;top:${q.y}%">${p.covered ? '<span class="card covered"></span>' : cardHtml(p.card, h.vira)}</div>`;
  }).join('');
  const viraHtml = `<div class="score vira-tile"><h3>Vira</h3><div class="row" style="gap:8px;flex-wrap:nowrap">${cardHtml(h.vira, null)}<span class="vlbl">manilha<br><b class="mrk">${manilhaRank(h.vira)}</b></span></div></div>`;
  const lastTrick = plays.length && old && st.phase === 'play' ? '<div class="last-trick">mão anterior</div>' : '';
  const banner = st.phase === 'truco' ? `<div class="banner">${RAISE_NAME[h.pending.to]}!</div>` : '';

  // minha mão
  let handHtml = '';
  const myTurn = seated && st.phase === 'play' && h.turn === me && !busy;
  if (seated) {
    const cards = h.hands[me];
    handHtml = `<div class="hand ${myTurn ? 'playable' : ''}">${cards.map((c, i) =>
      `<button class="card ${cardClass(c, h.vira)}" data-play="${i}" data-c="${c}" ${myTurn ? '' : 'disabled'} aria-label="${cardLabel(c)}${isManilha(c, h.vira) ? ', manilha' : ''}">${cardInner(c, h.vira)}</button>`).join('')}</div>`;
  }
  let partnerHtml = '';
  if (showPartner) {
    for (let s = 0; s < st.n; s++) if (s !== me && team(s) === team(me)) {
      partnerHtml += `<div class="partner"><h3>Cartas de ${esc(nick(st, s))}</h3><div class="hand">${h.hands[s].map(c => cardHtml(c, h.vira)).join('')}</div></div>`;
    }
  }

  // ações
  let msg = '', btns = '';
  if (st.phase === 'play') {
    if (myTurn) {
      msg = '<strong>Sua vez.</strong> Escolha uma carta.';
      if (canCallTruco(st, me)) btns += `<button class="shout" data-act="truco">${RAISE_NAME[NEXT_VALUE[h.value]]}!</button>`;
      if (r >= 1) btns += `<button id="cover" aria-pressed="${cover}">${cover ? 'Coberta: ligada' : 'Jogar coberta'}</button>`;
    } else msg = `Vez de <strong>${esc(nick(st, h.turn))}</strong>.`;
  } else if (st.phase === 'truco') {
    const p = h.pending;
    if (seated && p.responder === me) {
      msg = `<strong>${esc(nick(st, p.caller))}</strong> pediu ${RAISE_NAME[p.to].toLowerCase()}. Aceita valendo ${p.to}?`;
      btns = `<button class="primary" data-act="accept">Aceitar (${p.to})</button><button class="danger" data-act="run">Correr (dá ${h.value})</button>`;
      if (p.to < 12) btns += `<button class="shout" data-act="raise">${RAISE_NAME[NEXT_VALUE[p.to]]}!</button>`;
    } else msg = `${esc(nick(st, p.caller))} pediu ${RAISE_NAME[p.to].toLowerCase()}. Esperando <strong>${esc(nick(st, p.responder))}</strong> responder.`;
  } else if (st.phase === 'onze') {
    if (seated && h.onzeDecider === me) {
      msg = '<strong>Mão de onze.</strong> Olhe as cartas e decida pelo time.';
      btns = `<button class="primary" data-act="onzePlay">Jogar (vale 3)</button><button class="danger" data-act="onzeRun">Correr (dá 1)</button>`;
    } else msg = `Mão de onze: <strong>${esc(nick(st, h.onzeDecider))}</strong> está decidindo se joga.`;
  } else if (st.phase === 'handEnd') {
    const res = st.result;
    msg = res.winner >= 0 ? `<strong>${seated ? (res.winner === us ? 'Vocês' : 'Eles') : teamLabel(res.winner)}</strong> ${seated ? 'fizeram' : 'fez'} ${res.points} ${res.points === 1 ? 'tento' : 'tentos'} (${esc(res.reason)}).` : 'Empatou tudo. Ninguém marca.';
    const nextDealer = (st.dealer + 1) % st.n;
    msg += ' Próxima mão já já.';
    if (seated && (me === nextDealer || st.owner === myId || solo)) btns = `<button class="primary" data-act="next">Dar as cartas agora</button>`;
  } else if (st.phase === 'gameEnd') {
    const g = st.games[0];
    const win = g.winner;
    msg = `<strong>${seated ? (win === us ? 'Vocês ganharam' : 'Vocês perderam') : teamLabel(win) + ' ganhou'}</strong> a partida ${g.n}, ${Math.min(st.score[win], 12)} a ${st.score[1 - win]}.`;
    if (st.torneio) msg = `<strong>${seated ? (win === us ? 'Vocês ganharam' : 'Vocês perderam') : teamLabel(win) + ' ganhou'}</strong> o jogo ${(st.torneio.g || 0) + 1} do confronto, ${Math.min(st.score[win], 12)} a ${st.score[1 - win]}.`;
    if (!st.torneio && seated && g.delta[myId] !== undefined) msg += ` Seu saldo nessa partida: <strong>${fmt(g.delta[myId])}</strong>.`;
    if (!solo && !st.torneio && seated && win === us) msg += ' Confirme em Pagamentos quando o Pix cair.';
    if (solo) btns = `<button class="primary" data-act="newGame">Nova partida</button>`;
    else if (st.torneio) { msg += ' Placar atualizado na chave do torneio.'; btns = `<button class="primary" data-act="tour">Voltar ao torneio</button>`; }
    else { msg += ' Mesa encerrada.'; btns = `<button class="primary" data-act="lobby">Voltar ao saguão</button>`; }
  }
  if (!seated) msg = '<span class="muted">Você está assistindo.</span> ' + msg;

  const scoreUs = Math.min(st.score[us], 12), scoreThem = Math.min(st.score[them], 12);
  saveChatDraft();
  const prevHand = captureHand();
  $app.innerHTML = `
  <div class="game">
    <div class="board">
      ${tableBar}
      <div class="scorebar">
        <div class="score us"><h3>${usLabel}</h3><b>${scoreUs}</b></div>
        <div class="score them"><h3>${themLabel}</h3><b>${scoreThem}</b></div>
        <div class="score"><h3>Valendo</h3><b>${h.value}</b></div>
        <div class="score"><h3>Vazas</h3><div class="pips" style="margin-top:8px">${pips}</div></div>
        ${viraHtml}
      </div>
      <div class="mesa ${st.n === 6 ? 'six' : ''}">${seatsHtml}${playedHtml}${lastTrick}${banner}
        ${seated ? (() => { const p = pos(me, [40, 40]); return `<div class="seat us me ${me === actor ? 'turn' : ''}" data-key="${esc(st.seats[me] || '')}" style="left:${p.x}%;top:${Math.min(p.y, 90)}%">${avatarHtml(st.seats[me], nick(st, me))}<span class="name">${esc(nick(st, me))} (você)</span></div>`; })() : ''}
      </div>
      ${solo ? '' : `<div class="mtools">${voiceOK() && canChat() ? '<button type="button" class="ptt round" data-ptt aria-label="Segure para falar com a mesa">🎤</button>' : ''}<button type="button" class="chat-toggle round" data-chatopen aria-label="Abrir conversa">💬${chatUnread ? `<span class="badge">${chatUnread}</span>` : ''}</button></div>`}
      <div class="actions"><p class="msg">${!solo && currentActor(st) >= 0 && st.turnAt ? `<span id="clock" class="clock ${timeLeft(st) <= 5 ? 'low' : ''}">${timeLeft(st)}s</span> ` : ''}${msg}</p><div class="row" style="justify-content:center">${btns}</div></div>
      ${handHtml}
      ${partnerHtml}
    </div>
    <aside class="side">${tableBar}${chatPanelHtml()}${ledgerHtml(st)}${account && !solo ? '<section class="panel" id="payPanel"></section>' : ''}</aside>
  </div>`;
  $app.querySelectorAll('[data-leave]').forEach(b => (b.onclick = showLobby));
  animateTable(st, hk, me, prevHand);
  if (canChat()) { if (!vz || vz.code !== code) startVoice(code); } else if (vz) stopVoice();
  bindChat();
  renderPayments();
  maybeShowPayOverlay(st);

  $app.querySelectorAll('[data-play]').forEach(b => (b.onclick = () => {
    const i = +b.dataset.play;
    anim.from = { rect: b.getBoundingClientRect(), at: Date.now() }; // a carta sai daqui
    const c = cover;
    cover = false;
    commit(s => { if (s.phase !== 'play' || s.hand.turn !== me) return false; playCard(s, me, i, c && s.hand.rw.length >= 1); });
  }));
  const cv = document.getElementById('cover'); if (cv) cv.onclick = () => { cover = !cover; render(); };
  $app.querySelectorAll('[data-act]').forEach(b => (b.onclick = () => (b.dataset.act === 'lobby' ? showLobby() : b.dataset.act === 'tour' ? openTournament(cur.torneio.tid) : act(b.dataset.act))));
}

/* =========================================================
   ANIMAÇÕES DA MESA
   Só anima o que é novo: a mesa é redesenhada a cada jogada, então
   cada carta jogada e cada pedido de truco é lembrado por uma chave.
   As cartas são animadas pela posição de verdade na tela (de onde
   saíram até onde pararam), por isso o movimento fica contínuo.
   ========================================================= */
const calmMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const handKey = st => st.code + '_' + (st.hand ? st.hand.hid || [st.gameNo, st.dealer, st.hand.vira].join('-') : '');
const anim = { table: null, seen: new Set(), hand: null, phase: null, pending: null, from: null, flying: new Set() };
const SMOOTH = 'cubic-bezier(.22, 1, .36, 1)';   // sai rápido e pousa devagar
const center = r => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
// posição das cartas da minha mão antes de redesenhar (para as que sobram deslizarem)
function captureHand() {
  const m = {};
  $app.querySelectorAll('.hand .card[data-c]').forEach(el => (m[el.dataset.c] = el.getBoundingClientRect()));
  return m;
}
function animateTable(st, hk, me, prevHand) {
  const fresh = anim.table !== st.code;           // acabou de abrir a mesa: não anima o que já estava lá
  if (fresh) { anim.table = st.code; anim.seen.clear(); anim.hand = anim.pending = null; }
  const h = st.hand, motion = !fresh && !calmMotion() && !!document.body.animate;
  const mesa = $app.querySelector('.mesa');
  const mc = mesa ? center(mesa.getBoundingClientRect()) : null;
  // 1. carta jogada: sai de onde estava e desliza até a mesa
  let played = 0;
  $app.querySelectorAll('.played[data-ak]').forEach(el => {
    const k = el.dataset.ak;
    if (anim.flying.has(k)) el.style.visibility = 'hidden';   // a cópia ainda está voando
    if (anim.seen.has(k)) return;
    anim.seen.add(k);
    if (fresh) return;
    played++;
    if (!motion || !mesa) return;
    const to = center(el.getBoundingClientRect());
    let from;
    const mine = el.dataset.ak.endsWith('|' + me) && me >= 0;
    if (mine && anim.from && Date.now() - anim.from.at < 4000) from = center(anim.from.rect);   // a carta que eu toquei
    else { const [fx, fy] = el.dataset.from.split(',').map(Number); from = { x: to.x + fx / 100 * mesa.clientWidth, y: to.y + fy / 100 * mesa.clientHeight }; }
    const dx = from.x - to.x, dy = from.y - to.y;
    const spin = (mine ? 0 : (Math.random() * 40 - 20)).toFixed(1);
    flyCard(el, k, dx, dy, spin, mine ? 1.3 : .8);
  });
  if (played) { cardSound(); anim.from = null; }
  // 2. cartas que ficaram na mão deslizam para o lugar novo
  if (motion && prevHand && anim.hand === hk) {
    $app.querySelectorAll('.hand .card[data-c]').forEach(el => {
      const old = prevHand[el.dataset.c]; if (!old) return;
      const now = el.getBoundingClientRect(), dx = old.left - now.left;
      if (Math.abs(dx) > 2) el.animate([{ transform: `translateX(${dx}px)` }, { transform: 'none' }], { duration: 320, easing: SMOOTH });
    });
  }
  // 3. mão nova: as cartas saem do meio da mesa, uma de cada vez
  if (anim.hand !== hk) {
    if (!fresh && anim.hand !== null) {
      const mine = [...$app.querySelectorAll('.hand .card')];
      mine.forEach((el, i) => {
        setTimeout(() => cardSound(0.6), 140 * i);
        if (!motion || !mc) return;
        const c = center(el.getBoundingClientRect());
        const turn = (Math.random() * 50 - 25).toFixed(1);
        el.animate([
          { transform: `translate(${mc.x - c.x}px, ${mc.y - c.y}px) rotate(${turn}deg) scale(.45)`, opacity: 0 },
          { opacity: 1, offset: .25 },
          { transform: 'none', opacity: 1 },
        ], { duration: 560, delay: 140 * i, easing: SMOOTH, fill: 'backwards' });
      });
      if (motion && mc) $app.querySelectorAll('.seat .mini .card').forEach((el, i) => {
        const c = center(el.getBoundingClientRect());
        el.animate([
          { transform: `translate(${mc.x - c.x}px, ${mc.y - c.y}px) scale(.6)`, opacity: 0 },
          { opacity: 1, offset: .3 },
          { transform: 'none', opacity: 1 },
        ], { duration: 480, delay: 60 * i, easing: SMOOTH, fill: 'backwards' });
      });
    }
    anim.hand = hk;
  }
  // 4. truco, seis, nove, doze: a palavra vem na direção da tela
  const p = h && h.pending;
  const pk = st.phase === 'truco' && p ? `${hk}|${p.to}|${p.caller}` : null;
  if (pk && pk !== anim.pending && !fresh) {
    shout(`${RAISE_NAME[p.to]}!`, `${nick(st, p.caller)} pediu`, '');
    if (me >= 0 && p.responder === me && navigator.vibrate) navigator.vibrate([90, 50, 90]);
  } else if (!fresh && anim.phase === 'truco' && st.phase !== 'truco' && anim.pending && anim.pending.startsWith(hk + '|')) {
    // resposta: aceitou ou correu
    if (st.phase === 'handEnd' || st.phase === 'gameEnd') shout('Correu!', '', 'run');
    else if (st.phase === 'play') shout('Aceitou!', `valendo ${h.value}`, 'ok');
  }
  if (pk) anim.pending = pk;
  anim.phase = st.phase;
}
// A carta voa numa cópia por cima de tudo (a mesa corta o que passa da borda),
// e a de verdade aparece quando a cópia pousa.
function flyCard(el, k, dx, dy, spin, from) {
  const card = el.querySelector('.card'); if (!card) return;
  const r = card.getBoundingClientRect();
  const g = card.cloneNode(true);
  Object.assign(g.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', margin: 0, zIndex: 55, pointerEvents: 'none', fontSize: getComputedStyle(card).fontSize });
  g.classList.add('ghost');
  document.body.appendChild(g);
  el.style.visibility = 'hidden';
  anim.flying.add(k);
  const done = () => {
    g.remove(); anim.flying.delete(k);
    $app.querySelectorAll('.played[data-ak]').forEach(p => { if (p.dataset.ak === k) p.style.visibility = ''; });
  };
  const a = g.animate([
    { transform: `translate(${dx}px, ${dy}px) rotate(${spin}deg) scale(${from})`, boxShadow: '0 22px 34px rgba(0,0,0,.5)' },
    { transform: 'none', boxShadow: '0 2px 6px rgba(0,0,0,.35)' },
  ], { duration: 560, easing: SMOOTH });
  a.onfinish = a.oncancel = done;
  setTimeout(done, 900); // se a aba estiver em segundo plano
}
function shout(text, sub, kind) {
  document.querySelectorAll('.fx').forEach(e => e.remove());
  const big = !kind, ms = big ? 1700 : 1150;
  const el = document.createElement('div');
  el.className = 'fx ' + (kind || '');
  el.setAttribute('role', 'status');
  el.innerHTML = (big ? '<div class="rays"></div>' : '') + `<div class="word">${esc(text)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms + 300);
  if (calmMotion() || !el.animate) return;
  const w = el.querySelector('.word'), tilt = big ? -7 : -4;
  // longe (pequena) → passa um pouco da tela → assenta → segue vindo e some
  w.animate([
    { transform: `translateZ(-2600px) rotate(${tilt - 10}deg)`, opacity: 0, easing: 'cubic-bezier(.15, .85, .3, 1)' },
    { transform: `translateZ(120px) rotate(${tilt + 2}deg)`, opacity: 1, offset: .26, easing: 'ease-out' },
    { transform: `translateZ(0) rotate(${tilt}deg)`, opacity: 1, offset: .36 },
    { transform: `translateZ(20px) rotate(${tilt}deg)`, opacity: 1, offset: .78, easing: 'cubic-bezier(.6, 0, .9, .5)' },
    { transform: `translateZ(520px) rotate(${tilt}deg)`, opacity: 0 },
  ], { duration: ms, fill: 'both' });
  el.animate([
    { background: 'rgba(0,0,0,0)' }, { background: 'rgba(0,0,0,.38)', offset: .25 },
    { background: 'rgba(0,0,0,.3)', offset: .78 }, { background: 'rgba(0,0,0,0)' },
  ], { duration: ms, fill: 'both' });
  const r = el.querySelector('.rays');
  if (r) r.animate([
    { transform: 'scale(.2) rotate(0deg)', opacity: 0 },
    { transform: 'scale(1) rotate(25deg)', opacity: 1, offset: .3 },
    { transform: 'scale(1.15) rotate(60deg)', opacity: .8, offset: .78 },
    { transform: 'scale(1.4) rotate(80deg)', opacity: 0 },
  ], { duration: ms, fill: 'both' });
}

/* Som de carta deslizando no pano: um chiado curto e baixinho, feito na hora
   (ruído filtrado), sem arquivo. Liga/desliga no painel do 🎵. */
const sfx = { ctx: null, noise: null, on: true };
try { sfx.on = localStorage.getItem('truco.efeitos') !== 'off'; } catch {}
function sfxReady() {
  if (sfx.ctx) return sfx.ctx.state === 'running';
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
  try {
    sfx.ctx = new AC();
    const n = Math.floor(sfx.ctx.sampleRate * 0.5), b = sfx.ctx.createBuffer(1, n, sfx.ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    sfx.noise = b;
  } catch { sfx.ctx = null; return false; }
  return sfx.ctx.state === 'running';
}
// o navegador só libera som depois de um toque na tela
document.addEventListener('pointerdown', () => { sfxReady(); if (sfx.ctx && sfx.ctx.state === 'suspended') sfx.ctx.resume().catch(() => {}); }, { capture: true });
function cardSound(level = 1) {
  if (!sfx.on || !sfxReady()) return;
  const c = sfx.ctx, t = c.currentTime + 0.01, dur = 0.16 + Math.random() * 0.05;
  const src = c.createBufferSource(); src.buffer = sfx.noise;
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
  bp.frequency.setValueAtTime(3200 + Math.random() * 600, t);
  bp.frequency.exponentialRampToValueAtTime(900, t + dur);       // o chiado "desce" como papel no pano
  const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
  const g = c.createGain();
  const peak = 0.05 * level;                                       // bem baixo
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.018);
  g.gain.exponentialRampToValueAtTime(peak * 0.35, t + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp).connect(hp).connect(g).connect(c.destination);
  src.start(t, Math.random() * 0.3, dur + 0.02);
}
function setSfx(on) {
  sfx.on = on;
  try { localStorage.setItem('truco.efeitos', on ? 'on' : 'off'); } catch {}
  if (on) cardSound();
  paintMusic();
}

function act(a, me = mySeat()) {
  commit(st => {
    const h = st.hand, p = h && h.pending;
    switch (a) {
      case 'truco':
        if (!canCallTruco(st, me)) return false;
        h.pending = { to: NEXT_VALUE[h.value], by: team(me), caller: me, responder: nextOfTeam(me, 1 - team(me), st.n) };
        st.phase = 'truco';
        addLog(st, `${nick(st, me)} pediu ${RAISE_NAME[h.pending.to].toLowerCase()}!`);
        break;
      case 'accept':
        if (st.phase !== 'truco' || p.responder !== me) return false;
        h.value = p.to; h.lastRaise = p.by; h.pending = null; st.phase = 'play';
        addLog(st, `${nick(st, me)} aceitou. Valendo ${h.value}.`);
        break;
      case 'run':
        if (st.phase !== 'truco' || p.responder !== me) return false;
        addLog(st, `${nick(st, me)} correu.`);
        endHand(st, p.by, h.value, 'o outro time correu');
        break;
      case 'raise':
        if (st.phase !== 'truco' || p.responder !== me || p.to >= 12) return false;
        h.value = p.to; h.lastRaise = p.by;
        h.pending = { to: NEXT_VALUE[p.to], by: team(me), caller: me, responder: p.caller };
        addLog(st, `${nick(st, me)} pediu ${RAISE_NAME[h.pending.to].toLowerCase()}!`);
        break;
      case 'onzePlay':
        if (st.phase !== 'onze' || h.onzeDecider !== me) return false;
        h.value = 3; st.phase = 'play';
        addLog(st, `${teamLabel(team(me))} vai jogar a mão de onze.`);
        break;
      case 'onzeRun':
        if (st.phase !== 'onze' || h.onzeDecider !== me) return false;
        addLog(st, `${teamLabel(team(me))} correu da mão de onze.`);
        endHand(st, 1 - team(me), 1, 'correram da mão de onze');
        break;
      case 'next':
        if (st.phase !== 'handEnd') return false;
        st.dealer = (st.dealer + 1) % st.n;
        deal(st);
        break;
      case 'newGame':
        if (st.phase !== 'gameEnd' || !solo) return false;
        st.score = [0, 0]; st.gameNo++; st.dealer = (st.dealer + 1) % st.n;
        addLog(st, `Começou a partida ${st.gameNo}.`);
        deal(st);
        break;
      default: return false;
    }
  });
}

function renderSeating(st, me) {
  const filled = st.seats.filter(Boolean).length;
  const rows = st.seats.map((id, i) => {
    const mine = id === myId;
    let right = '';
    if (!id) right = `<button class="small" data-sit="${i}">Sentar aqui</button>`;
    else if (mine) right = `<button class="small" data-stand>Levantar</button>`;
    else if (st.owner === myId) right = `<button class="small danger" data-kick="${i}">Tirar</button>`;
    return `<div class="seat-row"><span><b class="team${team(i)}">Cadeira ${i + 1}</b> · <span class="muted">${teamLabel(team(i))}</span><br>${id ? esc(st.names[id] || 'Jogador') + (mine ? ' (você)' : '') : '<span class="muted">vazia</span>'}</span>${right}</div>`;
  }).join('');
  $app.innerHTML = `
    <div class="grid2">
      <section class="panel">
        <h2>Mesa <span class="code">${esc(st.code)}</span></h2>
        <p class="muted">${st.torneio ? `Jogo ${(st.torneio.g || 0) + 1} do torneio <b>${esc(st.torneio.nome || '')}</b> (melhor de 3). Quando os 4 estiverem aqui, toquem em Começar partida.` : `Mande o código para a turma. ${modeLabel(st.n)}, cada partida vale $ ${esc(st.stake)}.`}</p>
        ${!account ? '<p class="notice">Entre com seu usuário no saguão para poder sentar.</p>' : ''}
        <div class="seats-lobby">${rows}</div>
        <div class="row"><button class="primary" id="start" ${filled === st.n && me >= 0 && !busy ? '' : 'disabled'}>Começar partida</button>
        <span class="muted">${filled}/${st.n} sentados</span></div>
      </section>
      <aside class="side">${ledgerHtml(st)}</aside>
    </div>`;
  $app.querySelectorAll('[data-sit]').forEach(b => (b.onclick = () => sit(+b.dataset.sit)));
  $app.querySelectorAll('[data-stand]').forEach(b => (b.onclick = () => commit(s => { const i = s.seats.indexOf(myId); if (i < 0 || s.phase !== 'lobby') return false; s.seats[i] = null; })));
  $app.querySelectorAll('[data-kick]').forEach(b => (b.onclick = () => commit(s => { if (s.phase !== 'lobby' || s.owner !== myId) return false; s.seats[+b.dataset.kick] = null; })));
  document.getElementById('start').onclick = () => commit(s => {
    if (s.phase !== 'lobby' || s.seats.some(x => !x)) return false;
    s.seats.forEach(id => { if (!(id in s.balances)) s.balances[id] = 0; });
    s.score = [0, 0]; s.gameNo = (s.gameNo || 0) + 1; s.dealer = randInt(s.n);
    addLog(s, `Começou a partida ${s.gameNo}.`);
    deal(s);
  });
}

const fmt = v => (v > 0 ? '+' : v < 0 ? '−' : '') + '$ ' + Math.abs(v);
const modeLabel = n => `${n / 2}x${n / 2}`;
function ledgerHtml(st) {
  const ids = Object.keys(st.balances || {});
  const rows = ids.sort((a, b) => st.balances[b] - st.balances[a]).map(id =>
    `<tr><td>${esc(st.names[id] || 'Jogador')}${id === myId ? ' (você)' : ''}</td><td class="${st.balances[id] > 0 ? 'pos' : st.balances[id] < 0 ? 'neg' : ''}">${fmt(st.balances[id])}</td></tr>`).join('');
  const wins = [0, 0]; (st.games || []).forEach(g => wins[g.winner]++);
  return `<section class="panel"><h3>Saldo de fichas</h3>
    ${rows ? `<table class="ledger"><tbody>${rows}</tbody></table>` : '<p class="muted">Ainda ninguém jogou nesta mesa.</p>'}
    <p class="muted" style="font-size:13px">${st.torneio ? 'Partida de torneio (sem aposta).' : `Cada partida vale $ ${esc(st.stake)}.`} Partidas: Time 1 ${wins[0]} × ${wins[1]} Time 2.</p></section>`;
}

function cardInner(c, vira) {
  return `<span class="rk">${c[0]}<i>${SUIT_SYM[c[1]]}</i></span><span class="big">${SUIT_SYM[c[1]]}</span>${vira && isManilha(c, vira) ? '<span class="star">★</span>' : ''}`;
}
function cardHtml(c, vira) {
  return `<span class="card ${cardClass(c, vira)}" role="img" aria-label="${cardLabel(c)}${vira && isManilha(c, vira) ? ', manilha' : ''}">${cardInner(c, vira)}</span>`;
}
// vermelho para ouros/copas; dourado para a manilha da mão
function cardClass(c, vira) {
  return (c[1] === 'o' || c[1] === 'c' ? 'red' : '') + (vira && isManilha(c, vira) ? ' manilha' : '');
}

init();
</script>
</body>
</html>
