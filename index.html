// ---- apagar a conversa (e o aperto de mão da voz) no fim da partida ----
async function clearChat(c) {
  if (!db || !c || chatCleared.has(c)) return;
  chatCleared.add(c);
  for (const colName of ['chat', 'voz']) {
    try {
      const snap = await db.collection(colName).where('table', '==', c).get();
      for (const d of snap.docs) { try { await db.collection(colName).doc(d.id).delete(); } catch {} }
    } catch {}
  }
}

function genCode() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[randInt(A.length)]; return s; }

async function createTable() {
  if (!account) return toast('Entre com seu usuário primeiro.');
  const n = +document.getElementById('n').value;
  const stake = CHIP_VALUES.includes(+document.getElementById('stake').value) ? +document.getElementById('stake').value : 1;
  const c = genCode();
  const st = {
    v: 1, code: c, n, stake, owner: myId, createdAt: Date.now(), updatedAt: Date.now(),
    seats: Array(n).fill(null), names: { [myId]: myNick }, phase: 'lobby', score: [0, 0], dealer: 0,
    hand: null, result: null, games: [], balances: {}, gameNo: 0, log: [],
  };
  st.seats[0] = myId;
  try { await tableRef(c).set(st); openTable(c); }
  catch { toast('Não deu para criar a mesa. Confira se você tem acesso de edição.'); }
}

/* =========================================================
   MESA
   ========================================================= */
function openTable(c) {
  if (!db) return;
  if (unsubList) { unsubList(); unsubList = null; }
  if (unsubRank) { unsubRank(); unsubRank = null; }
  if (unsubTable) unsubTable();
  stopTableTimers();
  code = c; cur = null; cover = false;
  let first = true;
  history.replaceState(null, '', '#' + c);
  $app.innerHTML = '<p class="muted">Procurando a mesa…</p>';
  document.getElementById('topRight').innerHTML = '';
  unsubTable = tableRef(c).onSnapshot(snap => {
    if (!snap.exists && cur && cur.code === c && cur.phase === 'gameEnd') return; // mesa apagada depois do fim: mantém o resultado na tela
    if (!snap.exists) { $app.innerHTML = `<div class="panel"><p>Mesa <span class="code">${esc(c)}</span> não encontrada.</p><div class="row"><button id="back">Voltar</button></div></div>`; document.getElementById('back').onclick = showLobby; return; }
    const data = snap.data();
    if (first) {
      first = false;
      if (!data.closedAt && isEmptyTable(data)) {
        removeTable(c);
        $app.innerHTML = `<div class="panel"><p>A mesa <span class="code">${esc(c)}</span> foi fechada porque ficou vazia.</p><div class="row"><button id="back">Voltar ao saguão</button></div></div>`;
        document.getElementById('back').onclick = showLobby;
        unsubTable(); unsubTable = null;
        return;
      }
      cur = data;
      startTableTimers(c);
      startChat(c);
    }
    cur = data;
    if (data.phase === 'gameEnd') clearChat(c); // fim da partida: a conversa some
    render();
  }, () => toast('A conexão com a mesa caiu. Recarregue a página.'));
}

/* =========================================================
   MESA VAZIA (30 s) E TEMPO POR JOGADA (20 s)
   ========================================================= */
const EMPTY_AFTER_MS = 30 * 1000;   // mesa sem ninguém com ela aberta
const TURN_MS = 20 * 1000;          // tempo de cada jogada
const DEAL_MS = 5 * 1000;           // depois de cada mão, as cartas saem sozinhas
const limitFor = st => (st.phase === 'handEnd' ? DEAL_MS : TURN_MS);
const GRACE_MS = 2000;              // os outros esperam um pouco antes de agir pelo jogador
const HEARTBEAT_MS = 10 * 1000;
let heartbeatTimer = null, clockTimer = null;

// Quem está com a mesa aberta avisa que está ali a cada 10 s (aliveAt).
const isEmptyTable = t => Date.now() - (t.aliveAt || t.updatedAt || 0) > EMPTY_AFTER_MS;

function startTableTimers(c) {
  stopTableTimers();
  const beat = () => { if (canWrite && code === c && cur && !cur.closedAt) tableRef(c).update({ aliveAt: Date.now() }).catch(() => {}); };
  beat();
  heartbeatTimer = setInterval(beat, HEARTBEAT_MS);
  clockTimer = setInterval(tickClock, 1000);
}
function stopTableTimers() { clearInterval(heartbeatTimer); clearInterval(clockTimer); heartbeatTimer = clockTimer = null; }

// Quem precisa agir agora, ou -1. Na hora de dar as cartas é o próximo a dar.
function currentActor(st) {
  const h = st.hand;
  if (!h) return -1;
  if (st.phase === 'play') return h.turn;
  if (st.phase === 'truco') return h.pending.responder;
  if (st.phase === 'onze') return h.onzeDecider;
  if (st.phase === 'handEnd') return (st.dealer + 1) % st.n;
  return -1;
}
function timeLeft(st) { return st.turnAt ? Math.max(0, Math.ceil((st.turnAt + limitFor(st) - Date.now()) / 1000)) : null; }

function tickClock() {
  if (!cur || solo) return;
  const el = document.getElementById('clock');
  const left = timeLeft(cur);
  if (el && left !== null) { el.textContent = left + 's'; el.classList.toggle('low', left <= 5); }
  const actor = currentActor(cur);
  if (actor < 0 || !cur.turnAt || busy) return;
  const late = Date.now() - cur.turnAt - limitFor(cur);
  const mine = cur.seats[actor] === myId;
  if (late >= (mine ? 0 : GRACE_MS) && (mine || mySeat() >= 0)) autoMove(cur.turnAt);
}

// Jogada automática quando o tempo acaba. É determinística, então se dois jogadores
// agirem ao mesmo tempo o resultado é o mesmo.
function autoMove(expectedTurnAt) {
  commit(st => {
    if (st.turnAt !== expectedTurnAt) return false;
    const h = st.hand, actor = currentActor(st);
    if (actor < 0) return false;
    if (st.phase === 'play') {
      const cards = h.hands[actor];
      let low = 0;
      cards.forEach((c, i) => { if (strength(c, h.vira) < strength(cards[low], h.vira)) low = i; });
      addLog(st, `Tempo esgotado: ${nick(st, actor)} jogou a menor carta.`);
      playCard(st, actor, low, false);
    } else if (st.phase === 'truco') {
      addLog(st, `Tempo esgotado: ${nick(st, actor)} não respondeu e correu.`);
      endHand(st, h.pending.by, h.value, 'tempo esgotado: o outro time correu');
    } else if (st.phase === 'onze') {
      addLog(st, `Tempo esgotado na mão de onze: ${teamLabel(team(actor))} correu.`);
      endHand(st, 1 - team(actor), 1, 'tempo esgotado na mão de onze');
    } else if (st.phase === 'handEnd') {
      st.dealer = actor;
      deal(st);
    } else return false;
  });
}

const mySeat = () => (cur ? cur.seats.indexOf(myId) : -1);

async function sit(i) {
  if (!account) return toast('Entre com seu usuário e senha no saguão para sentar.');
  try {
    const lock = await db.doc('mesas/' + code + '/locks/seats').acquire({ holder: myId, ttlMs: 4000 });
    if (!lock.acquired) return toast('Alguém está sentando agora. Tente de novo em um segundo.');
    const s = await tableRef(code).get();
    cur = s.data();
  } catch {}
  commit(st => {
    if (st.phase !== 'lobby' || st.seats[i]) { toast('Essa cadeira já está ocupada.'); return false; }
    const old = st.seats.indexOf(myId);
    if (old >= 0) st.seats[old] = null;
    st.seats[i] = myId; st.names[myId] = myNick;
    if (old < 0) addLog(st, `${myNick} sentou na mesa.`);
  });
}

function render() {
  if (!cur) return;
  const st = cur, me = mySeat(), seated = me >= 0;
  const view = seated ? me : 0;
  const myTeam = team(view);
  if (st.phase === 'lobby') {
    document.body.classList.remove('in-game');
    document.getElementById('topRight').innerHTML = `<span class="muted">Mesa</span> <span class="code">${esc(st.code)}</span> <button class="small" id="copy">Copiar código</button> <button class="small" id="leave">Saguão</button>`;
    document.getElementById('copy').onclick = () => navigator.clipboard?.writeText(st.code).then(() => toast('Código copiado.'), () => toast('Código: ' + st.code));
    document.getElementById('leave').onclick = showLobby;
    return renderSeating(st, me);
  }
  // durante o jogo a tela é só a mesa: sem cabeçalho, Mesa e Saguão vão para o lado
  document.body.classList.add('in-game');
  document.getElementById('topRight').innerHTML = '';
  const tableBar = `<div class="tablebar">${solo ? '<span class="tag">Treino</span>' : `<span class="muted">Mesa</span> <span class="code">${esc(st.code)}</span> <span class="tag stake">vale $ ${esc(st.stake)}</span>`}${chatToggleHtml()}<button class="small" data-leave>Saguão</button></div>`;

  const h = st.hand;
  const r = h.rw.length;
  const usLabel = seated ? 'Nós' : teamLabel(0), themLabel = seated ? 'Eles' : teamLabel(1);
  const us = myTeam, them = 1 - myTeam;
  const pip = t => (t === undefined ? '' : t === -1 ? 'tie' : t === us ? 'us' : 'them');
  const pips = [0, 1, 2].map(i => `<span class="pip ${pip(h.rw[i])}" title="Vaza ${i + 1}"></span>`).join('');

  // posições na mesa: eu embaixo, sentido anti-horário
  const pos = (seat, rad) => {
    const k = (seat - view + st.n) % st.n;
    const ang = (90 - (k * 360) / st.n) * Math.PI / 180;
    return { x: 50 + rad[0] * Math.cos(ang), y: 50 + rad[1] * Math.sin(ang) };
  };
  const showPartner = h.onzeTeam >= 0 && seated && team(me) === h.onzeTeam && st.n > 2 && st.phase !== 'gameEnd';
  const actor = st.phase === 'truco' ? h.pending.responder : st.phase === 'onze' ? h.onzeDecider : st.phase === 'play' ? h.turn : -1;

  let seatsHtml = '';
  for (let s = 0; s < st.n; s++) {
    if (seated && s === me) continue;
    const p = pos(s, [35, 37]);
    const cls = team(s) === us ? 'us' : 'them';
    const left = h.hands[s].length;
    const backs = Array.from({ length: left }, () => '<span class="card back"></span>').join('');
    const role = [s === st.dealer ? 'deu as cartas' : '', s === h.mao ? 'mão' : ''].filter(Boolean).join(' · ');
    seatsHtml += `<div class="seat ${cls} ${s === actor ? 'turn' : ''}" data-key="${esc(st.seats[s] || '')}" style="left:${p.x}%;top:${p.y}%">${avatarHtml(st.seats[s], nick(st, s))}<span class="name">${esc(nick(st, s))}</span><span class="mini">${backs}</span>${role ? `<span class="role">${role}</span>` : ''}</div>`;
  }
  // cartas jogadas: rodada atual, ou a última encerrada
  let showRound = h.played[r] && h.played[r].length ? r : r - 1;
  if (showRound < 0) showRound = 0;
  const plays = h.played[showRound] || [];
  const old = showRound !== r || st.phase === 'handEnd' || st.phase === 'gameEnd';
  let winSeat = -1;
  if (h.rw[showRound] !== undefined && h.rw[showRound] >= 0) {
    const str = p => (p.covered ? -1 : strength(p.card, h.vira));
    const best = Math.max(...plays.map(str));
    const tops = plays.filter(p => str(p) === best && team(p.seat) === h.rw[showRound] && !p.covered);
    winSeat = (tops.length ? tops.reduce((x, y) => (SUITS.indexOf(y.card[1]) > SUITS.indexOf(x.card[1]) ? y : x)) : plays.find(p => str(p) === best)).seat;
  }
  const playedHtml = plays.map(p => {
    const q = pos(p.seat, st.n === 6 ? [22, 24] : [20, 15]);
    return `<div class="played ${p.seat === winSeat ? 'win' : ''} ${old && st.phase === 'play' ? 'old' : ''}" style="left:${q.x}%;top:${q.y}%">${p.covered ? '<span class="card covered"></span>' : cardHtml(p.card, h.vira)}</div>`;
  }).join('');
  const viraHtml = `<div class="score vira-tile"><h3>Vira</h3><div class="row" style="gap:8px;flex-wrap:nowrap">${cardHtml(h.vira, null)}<span class="vlbl">manilha<br><b class="mrk">${manilhaRank(h.vira)}</b></span></div></div>`;
  const lastTrick = plays.length && old && st.phase === 'play' ? '<div class="last-trick">mão anterior</div>' : '';
  const banner = st.phase === 'truco' ? `<div class="banner">${RAISE_NAME[h.pending.to]}!</div>` : '';

  // minha mão
  let handHtml = '';
  const myTurn = seated && st.phase === 'play' && h.turn === me && !busy;
  if (seated) {
    const cards = h.hands[me];
    handHtml = `<div class="hand ${myTurn ? 'playable' : ''}">${cards.map((c, i) =>
      `<button class="card ${cardClass(c, h.vira)}" data-play="${i}" ${myTurn ? '' : 'disabled'} aria-label="${cardLabel(c)}${isManilha(c, h.vira) ? ', manilha' : ''}">${cardInner(c, h.vira)}</button>`).join('')}</div>`;
  }
  let partnerHtml = '';
  if (showPartner) {
    for (let s = 0; s < st.n; s++) if (s !== me && team(s) === team(me)) {
      partnerHtml += `<div class="partner"><h3>Cartas de ${esc(nick(st, s))}</h3><div class="hand">${h.hands[s].map(c => cardHtml(c, h.vira)).join('')}</div></div>`;
    }
  }

  // ações
  let msg = '', btns = '';
  if (st.phase === 'play') {
    if (myTurn) {
      msg = '<strong>Sua vez.</strong> Escolha uma carta.';
      if (canCallTruco(st, me)) btns += `<button class="shout" data-act="truco">${RAISE_NAME[NEXT_VALUE[h.value]]}!</button>`;
      if (r >= 1) btns += `<button id="cover" aria-pressed="${cover}">${cover ? 'Coberta: ligada' : 'Jogar coberta'}</button>`;
    } else msg = `Vez de <strong>${esc(nick(st, h.turn))}</strong>.`;
  } else if (st.phase === 'truco') {
    const p = h.pending;
    if (seated && p.responder === me) {
      msg = `<strong>${esc(nick(st, p.caller))}</strong> pediu ${RAISE_NAME[p.to].toLowerCase()}. Aceita valendo ${p.to}?`;
      btns = `<button class="primary" data-act="accept">Aceitar (${p.to})</button><button class="danger" data-act="run">Correr (dá ${h.value})</button>`;
      if (p.to < 12) btns += `<button class="shout" data-act="raise">${RAISE_NAME[NEXT_VALUE[p.to]]}!</button>`;
    } else msg = `${esc(nick(st, p.caller))} pediu ${RAISE_NAME[p.to].toLowerCase()}. Esperando <strong>${esc(nick(st, p.responder))}</strong> responder.`;
  } else if (st.phase === 'onze') {
    if (seated && h.onzeDecider === me) {
      msg = '<strong>Mão de onze.</strong> Olhe as cartas e decida pelo time.';
      btns = `<button class="primary" data-act="onzePlay">Jogar (vale 3)</button><button class="danger" data-act="onzeRun">Correr (dá 1)</button>`;
    } else msg = `Mão de onze: <strong>${esc(nick(st, h.onzeDecider))}</strong> está decidindo se joga.`;
  } else if (st.phase === 'handEnd') {
    const res = st.result;
    msg = res.winner >= 0 ? `<strong>${seated ? (res.winner === us ? 'Vocês' : 'Eles') : teamLabel(res.winner)}</strong> ${seated ? 'fizeram' : 'fez'} ${res.points} ${res.points === 1 ? 'tento' : 'tentos'} (${esc(res.reason)}).` : 'Empatou tudo. Ninguém marca.';
    const nextDealer = (st.dealer + 1) % st.n;
    msg += ' Próxima mão já já.';
    if (seated && (me === nextDealer || st.owner === myId || solo)) btns = `<button class="primary" data-act="next">Dar as cartas agora</button>`;
  } else if (st.phase === 'gameEnd') {
    const g = st.games[0];
    const win = g.winner;
    msg = `<strong>${seated ? (win === us ? 'Vocês ganharam' : 'Vocês perderam') : teamLabel(win) + ' ganhou'}</strong> a partida ${g.n}, ${Math.min(st.score[win], 12)} a ${st.score[1 - win]}.`;
    if (seated && g.delta[myId] !== undefined) msg += ` Seu saldo nessa partida: <strong>${fmt(g.delta[myId])}</strong>.`;
    if (!solo && seated && win === us) msg += ' Confirme em Pagamentos quando o Pix cair.';
    if (solo) btns = `<button class="primary" data-act="newGame">Nova partida</button>`;
    else { msg += ' Mesa encerrada.'; btns = `<button class="primary" data-act="lobby">Voltar ao saguão</button>`; }
  }
  if (!seated) msg = '<span class="muted">Você está assistindo.</span> ' + msg;

  const scoreUs = Math.min(st.score[us], 12), scoreThem = Math.min(st.score[them], 12);
  saveChatDraft();
  $app.innerHTML = `
  <div class="game">
    <div class="board">
      ${tableBar}
      <div class="scorebar">
        <div class="score us"><h3>${usLabel}</h3><b>${scoreUs}</b></div>
        <div class="score them"><h3>${themLabel}</h3><b>${scoreThem}</b></div>
        <div class="score"><h3>Valendo</h3><b>${h.value}</b></div>
        <div class="score"><h3>Vazas</h3><div class="pips" style="margin-top:8px">${pips}</div></div>
        ${viraHtml}
      </div>
      <div class="mesa ${st.n === 6 ? 'six' : ''}">${seatsHtml}${playedHtml}${lastTrick}${banner}
        ${seated ? (() => { const p = pos(me, [40, 40]); return `<div class="seat us me ${me === actor ? 'turn' : ''}" data-key="${esc(st.seats[me] || '')}" style="left:${p.x}%;top:${Math.min(p.y, 90)}%">${avatarHtml(st.seats[me], nick(st, me))}<span class="name">${esc(nick(st, me))} (você)</span></div>`; })() : ''}
      </div>
      <div class="actions"><p class="msg">${!solo && currentActor(st) >= 0 && st.turnAt ? `<span id="clock" class="clock ${timeLeft(st) <= 5 ? 'low' : ''}">${timeLeft(st)}s</span> ` : ''}${msg}</p><div class="row" style="justify-content:center">${btns}</div></div>
      ${handHtml}
      ${partnerHtml}
    </div>
    <aside class="side">${tableBar}${chatPanelHtml()}${ledgerHtml(st)}${account && !solo ? '<section class="panel" id="payPanel"></section>' : ''}</aside>
  </div>`;
  $app.querySelectorAll('[data-leave]').forEach(b => (b.onclick = showLobby));
  if (canChat()) { if (!vz || vz.code !== code) startVoice(code); } else if (vz) stopVoice();
  bindChat();
  renderPayments();
  maybeShowPayOverlay(st);

  $app.querySelectorAll('[data-play]').forEach(b => (b.onclick = () => {
    const i = +b.dataset.play;
    const c = cover;
    cover = false;
    commit(s => { if (s.phase !== 'play' || s.hand.turn !== me) return false; playCard(s, me, i, c && s.hand.rw.length >= 1); });
  }));
  const cv = document.getElementById('cover'); if (cv) cv.onclick = () => { cover = !cover; render(); };
  $app.querySelectorAll('[data-act]').forEach(b => (b.onclick = () => (b.dataset.act === 'lobby' ? showLobby() : act(b.dataset.act))));
}

function act(a, me = mySeat()) {
  commit(st => {
    const h = st.hand, p = h && h.pending;
    switch (a) {
      case 'truco':
        if (!canCallTruco(st, me)) return false;
        h.pending = { to: NEXT_VALUE[h.value], by: team(me), caller: me, responder: nextOfTeam(me, 1 - team(me), st.n) };
        st.phase = 'truco';
        addLog(st, `${nick(st, me)} pediu ${RAISE_NAME[h.pending.to].toLowerCase()}!`);
        break;
      case 'accept':
        if (st.phase !== 'truco' || p.responder !== me) return false;
        h.value = p.to; h.lastRaise = p.by; h.pending = null; st.phase = 'play';
        addLog(st, `${nick(st, me)} aceitou. Valendo ${h.value}.`);
        break;
      case 'run':
        if (st.phase !== 'truco' || p.responder !== me) return false;
        addLog(st, `${nick(st, me)} correu.`);
        endHand(st, p.by, h.value, 'o outro time correu');
        break;
      case 'raise':
        if (st.phase !== 'truco' || p.responder !== me || p.to >= 12) return false;
        h.value = p.to; h.lastRaise = p.by;
        h.pending = { to: NEXT_VALUE[p.to], by: team(me), caller: me, responder: p.caller };
        addLog(st, `${nick(st, me)} pediu ${RAISE_NAME[h.pending.to].toLowerCase()}!`);
        break;
      case 'onzePlay':
        if (st.phase !== 'onze' || h.onzeDecider !== me) return false;
        h.value = 3; st.phase = 'play';
        addLog(st, `${teamLabel(team(me))} vai jogar a mão de onze.`);
        break;
      case 'onzeRun':
        if (st.phase !== 'onze' || h.onzeDecider !== me) return false;
        addLog(st, `${teamLabel(team(me))} correu da mão de onze.`);
        endHand(st, 1 - team(me), 1, 'correram da mão de onze');
        break;
      case 'next':
        if (st.phase !== 'handEnd') return false;
        st.dealer = (st.dealer + 1) % st.n;
        deal(st);
        break;
      case 'newGame':
        if (st.phase !== 'gameEnd' || !solo) return false;
        st.score = [0, 0]; st.gameNo++; st.dealer = (st.dealer + 1) % st.n;
        addLog(st, `Começou a partida ${st.gameNo}.`);
        deal(st);
        break;
      default: return false;
    }
  });
}

function renderSeating(st, me) {
  const filled = st.seats.filter(Boolean).length;
  const rows = st.seats.map((id, i) => {
    const mine = id === myId;
    let right = '';
    if (!id) right = `<button class="small" data-sit="${i}">Sentar aqui</button>`;
    else if (mine) right = `<button class="small" data-stand>Levantar</button>`;
    else if (st.owner === myId) right = `<button class="small danger" data-kick="${i}">Tirar</button>`;
    return `<div class="seat-row"><span><b class="team${team(i)}">Cadeira ${i + 1}</b> · <span class="muted">${teamLabel(team(i))}</span><br>${id ? esc(st.names[id] || 'Jogador') + (mine ? ' (você)' : '') : '<span class="muted">vazia</span>'}</span>${right}</div>`;
  }).join('');
  $app.innerHTML = `
    <div class="grid2">
      <section class="panel">
        <h2>Mesa <span class="code">${esc(st.code)}</span></h2>
        <p class="muted">Mande o código para a turma. ${modeLabel(st.n)}, cada partida vale $ ${esc(st.stake)}.</p>
        ${!account ? '<p class="notice">Entre com seu usuário no saguão para poder sentar.</p>' : ''}
        <div class="seats-lobby">${rows}</div>
        <div class="row"><button class="primary" id="start" ${filled === st.n && me >= 0 && !busy ? '' : 'disabled'}>Começar partida</button>
        <span class="muted">${filled}/${st.n} sentados</span></div>
      </section>
      <aside class="side">${ledgerHtml(st)}</aside>
    </div>`;
  $app.querySelectorAll('[data-sit]').forEach(b => (b.onclick = () => sit(+b.dataset.sit)));
  $app.querySelectorAll('[data-stand]').forEach(b => (b.onclick = () => commit(s => { const i = s.seats.indexOf(myId); if (i < 0 || s.phase !== 'lobby') return false; s.seats[i] = null; })));
  $app.querySelectorAll('[data-kick]').forEach(b => (b.onclick = () => commit(s => { if (s.phase !== 'lobby' || s.owner !== myId) return false; s.seats[+b.dataset.kick] = null; })));
  document.getElementById('start').onclick = () => commit(s => {
    if (s.phase !== 'lobby' || s.seats.some(x => !x)) return false;
    s.seats.forEach(id => { if (!(id in s.balances)) s.balances[id] = 0; });
    s.score = [0, 0]; s.gameNo = (s.gameNo || 0) + 1; s.dealer = randInt(s.n);
    addLog(s, `Começou a partida ${s.gameNo}.`);
    deal(s);
  });
}

const fmt = v => (v > 0 ? '+' : v < 0 ? '−' : '') + '$ ' + Math.abs(v);
const modeLabel = n => `${n / 2}x${n / 2}`;
function ledgerHtml(st) {
  const ids = Object.keys(st.balances || {});
  const rows = ids.sort((a, b) => st.balances[b] - st.balances[a]).map(id =>
    `<tr><td>${esc(st.names[id] || 'Jogador')}${id === myId ? ' (você)' : ''}</td><td class="${st.balances[id] > 0 ? 'pos' : st.balances[id] < 0 ? 'neg' : ''}">${fmt(st.balances[id])}</td></tr>`).join('');
  const wins = [0, 0]; (st.games || []).forEach(g => wins[g.winner]++);
  return `<section class="panel"><h3>Saldo de fichas</h3>
    ${rows ? `<table class="ledger"><tbody>${rows}</tbody></table>` : '<p class="muted">Ainda ninguém jogou nesta mesa.</p>'}
    <p class="muted" style="font-size:13px">Cada partida vale $ ${esc(st.stake)}. Partidas: Time 1 ${wins[0]} × ${wins[1]} Time 2.</p></section>`;
}

function cardInner(c, vira) {
  return `<span class="rk">${c[0]}<i>${SUIT_SYM[c[1]]}</i></span><span class="big">${SUIT_SYM[c[1]]}</span>${vira && isManilha(c, vira) ? '<span class="star">★</span>' : ''}`;
}
function cardHtml(c, vira) {
  return `<span class="card ${cardClass(c, vira)}" role="img" aria-label="${cardLabel(c)}${vira && isManilha(c, vira) ? ', manilha' : ''}">${cardInner(c, vira)}</span>`;
}
// vermelho para ouros/copas; dourado para a manilha da mão
function cardClass(c, vira) {
  return (c[1] === 'o' || c[1] === 'c' ? 'red' : '') + (vira && isManilha(c, vira) ? ' manilha' : '');
}

init();
</script>
</body>
</html>
